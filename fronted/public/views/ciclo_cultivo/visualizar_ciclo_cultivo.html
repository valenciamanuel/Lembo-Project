<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizar Ciclos de Cultivo</title>
  <link rel="stylesheet" href="/fronted/public/css/components/visualizar.css">
  <script src="/fronted/public/views/components/header.js" defer></script>
</head>
<body>

  <!-- GOV superior -->
  <div class="gov-top">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top">
  </div>

  <!-- Header verde -->
  <header class="header">
    <img src="/fronted/public/img/logo.png" alt="Logo" class="header__logo">
    <nav class="header__nav">
      <a href="#" class="header__link">Inicio</a>
      <a href="#" class="header__link">Ciclos</a>
      <a href="#" class="header__link">Contacto</a>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main class="content-container">
    <h2 class="form__title">Ciclos de Cultivo Registrados</h2>

    <div id="ciclos-container" class="cards-container">
      <!-- JS insertará cada card -->
    </div>
  </main>

  <!-- Footer verde -->
  <footer class="footer">
    &copy; 2025 Mi Plataforma Agro | Todos los derechos reservados
  </footer>

  <!-- GOV inferior -->
  <div class="gov-bottom">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom">
  </div>

  <!-- JS para cargar ciclos -->
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const response = await fetch("http://localhost:3000/ciclocultivo");
        if (!response.ok) throw new Error("Error al obtener ciclos de cultivo");

        const ciclos = await response.json();
        const container = document.getElementById("ciclos-container");
        container.innerHTML = "";

        if (ciclos.length === 0) {
          container.innerHTML = `<p class="no-ciclos">No hay ciclos de cultivo registrados</p>`;
          return;
        }

        ciclos.forEach(c => {
          const card = document.createElement("div");
          card.classList.add("card");

          card.innerHTML = `
            <div class="card-image">
              ${c.image ? `<img src="/uploads/${c.image}" alt="${c.cicloName}">` : `<div class="no-image">Sin imagen</div>`}
            </div>
            <div class="card-content">
              <h3>🌱 ${c.cicloName}</h3>
              <p><strong>Código:</strong> ${c.cicloID}</p>
              <p><strong>Fecha Siembra:</strong> ${c.siembraDate}</p>
              <p><strong>Fecha Cosecha:</strong> ${c.cosechaDate}</p>
              <p><strong>Novedades:</strong> ${c.news}</p>
              <p><strong>Descripción:</strong> ${c.description}</p>
              <p><strong>Estado:</strong> <span class="estado ${c.state ? c.state.toLowerCase() : ''}">${c.state || "Sin estado"}</span></p>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (error) {
        console.error("❌ Error cargando ciclos de cultivo:", error);
        document.getElementById("ciclos-container").innerHTML = `<p class="no-ciclos">Error al cargar ciclos de cultivo</p>`;
      }
    });
  </script>

</body>
</html>
