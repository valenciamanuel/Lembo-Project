<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listar Sensores</title>
  <link rel="stylesheet" href="/css/components/listar.css">
  <script src="/fronted/public/views/components/header.js" defer></script>
  <link rel="stylesheet" href="/fronted/public/css/components/listar.css">
</head>
<body>
  <header class="header"></header>

  <main class="content-container">
    <h2 class="form__title">Sensores Registrados</h2>

    <table class="styled-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Tipo</th>
          <th>Nombre</th>
          <th>Ubicación</th>
          <th>Tiempo de Escaneo</th>
          <th>Descripción</th>
          <th>Estado</th>
          <th>Imagen</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="sensores-table">
        <!-- Filas dinámicas -->
      </tbody>
    </table>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const response = await fetch("http://localhost:3000/sensores"); 
        if (!response.ok) throw new Error("Error al obtener sensores");

        const sensores = await response.json();
        const tableBody = document.getElementById("sensores-table");
        tableBody.innerHTML = "";

        if (sensores.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="6">No hay sensores registrados</td></tr>`;
          return;
        }

        sensores.forEach(s => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${s.idSensor}</td>
            <td>${s.tipoSensor}</td>
            <td>${s.nombreSensor}</td>
            <td>${s.unidadMedida}</td>
            <td>${s.tiempoEscaneo}</td>
            <td>${s.descripcion}</td>
            <td>${s.estado}</td>
            <td>${s.imagen ? `<img src="/uploads/${s.imagen}" width="60">` : "Sin imagen"}</td>
            <td>
                <a href="../ciclo_cultivo/datos_ciclo_cultivo.html?id=${s.id}" class="edit-link">Editar</a>
            </td>
          `;
          tableBody.appendChild(row);
        });
      } catch (error) {
        console.error("❌ Error cargando sensores:", error);
      }
    });
  </script>
</body>
</html>
