<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Editar Uso de Insumo</title>
  <link rel="stylesheet" href="/fronted/public/css/main.css" />
  <link rel="stylesheet" href="/fronted/public/css/pages/editar.css" />
  <script src="/fronted/public/views/components/header.js" defer></script>
</head>
<body>
  <!-- Barra GOV superior -->
  <div class="gov-top">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top">
  </div>
  <header class="header"></header>

  <main class="form-container">
    <form class="form" id="edit-uso-form">
      <h2 class="form__title">Editar Uso de Insumo</h2>
      <input type="hidden" id="usoId">

      <div class="form__row">
        <div class="form__column">
          <label class="form__label">Fecha de Uso</label>
          <input class="form__input" type="date" id="fechaUso" required>
        </div>
        <div class="form__column">
          <label class="form__label">Cantidad</label>
          <input class="form__input" type="number" id="cantidad" step="0.01" required>
        </div>
      </div>

      <div class="form__row">
        <div class="form__column">
          <label class="form__label">Responsable</label>
          <input class="form__input" type="text" id="responsable" required>
        </div>
        <div class="form__column">
          <label class="form__label">Valor Unitario</label>
          <input class="form__input" type="number" id="valorUnitario" step="0.01" required>
        </div>
      </div>

      <div class="form__row">
        <div class="form__column">
          <label class="form__label">Valor Total</label>
          <input class="form__input" type="number" id="valorTotal" step="0.01" required>
        </div>
        <div class="form__column">
          <label class="form__label">Observaciones</label>
          <textarea class="form__input" id="observaciones"></textarea>
        </div>
      </div>

      <div class="form__row">
        <div class="form__column">
          <label class="form__label">Insumo</label>
          <select class="form__input" id="insumoSelect" required>
            <option value="">-- Seleccione insumo --</option>
          </select>
        </div>
        <div class="form__column"></div>
      </div>

      <div class="form__btn-group">
        <button type="submit" class="form__btn form__btn--registrar">Actualizar</button>
        <a href="listar_uso_insumo.html" class="btn__secundary">Cancelar</a>
      </div>
    </form>
  </main>

  <!-- Barra GOV inferior -->
  <div class="gov-bottom">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom">
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      if (!id) {
        alert("ID de uso de insumo no proporcionado.");
        return;
      }

      const form = document.getElementById("edit-uso-form");
      const usoId = document.getElementById("usoId");
      const fechaInput = document.getElementById("fechaUso");
      const cantidadInput = document.getElementById("cantidad");
      const responsableInput = document.getElementById("responsable");
      const valorUnitInput = document.getElementById("valorUnitario");
      const valorTotalInput = document.getElementById("valorTotal");
      const obsInput = document.getElementById("observaciones");
      const insumoSelect = document.getElementById("insumoSelect");

      // Cargar lista de insumos
      try {
        const resInsumos = await fetch("http://localhost:3000/insumo");
        const insumos = await resInsumos.json();
        insumos.forEach(i => {
          const opt = document.createElement("option");
          opt.value = i.nombreInsumo;
          opt.textContent = i.nombreInsumo;
          insumoSelect.appendChild(opt);
        });
      } catch (e) {
        console.error("Error cargando insumos:", e);
      }

      // Cargar datos existentes
      try {
        const res = await fetch(`http://localhost:3000/uso_insumo/${id}`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        usoId.value = data.id;
        fechaInput.value = data.fecha_uso;
        cantidadInput.value = data.cantidad;
        responsableInput.value = data.responsable;
        valorUnitInput.value = data.valor_unitario;
        valorTotalInput.value = data.valor_total;
        obsInput.value = data.observaciones || "";
        insumoSelect.value = data.insumo;
      } catch (e) {
        console.error("Error cargando uso:", e);
        alert("No se pudo cargar el registro.");
      }

      // Guardar cambios
      form.addEventListener("submit", async e => {
        e.preventDefault();
        const updated = {
          fecha_uso: fechaInput.value,
          cantidad: parseFloat(cantidadInput.value),
          responsable: responsableInput.value,
          valor_unitario: parseFloat(valorUnitInput.value),
          valor_total: parseFloat(valorTotalInput.value),
          observaciones: obsInput.value,
          insumo: insumoSelect.value
        };
        try {
          const res = await fetch(`http://localhost:3000/uso_insumo/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(updated)
          });
          if (!res.ok) throw new Error();
          alert("Uso de insumo actualizado.");
          window.location.href = "listar_uso_insumo.html";
        } catch (err) {
          console.error("Error al actualizar uso:", err);
          alert("Error al actualizar.");
        }
      });
    });
  </script>
</body>
</html>
