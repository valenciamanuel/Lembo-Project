<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Usuario</title>
  <link rel="stylesheet" href="/fronted/public/css/main.css">
  <link rel="stylesheet" href="/fronted/public/css/pages/crear.css">
  <script src="/fronted/public/views/components/header.js" defer></script>
  <style>
    .form__message.error { color: #dc3545; margin-bottom: 1rem; font-size: 1.2rem; }
  </style>
</head>
<body>
  <!-- GOV superior -->
  <div class="gov-top">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top">
  </div>
  <header class="header" style="top: 5rem;"></header>

  <main class="form-container">
    <form class="form" id="edit-user-form" novalidate>
      <h2 class="form__title">Editar Usuario</h2>
      <input type="hidden" id="userId">

      <div class="form__row">
        <div class="form__column">
          <label class="form__label" for="usertype">Tipo de Usuario</label>
          <select id="usertype" class="form__input" required>
            <option value="">Seleccione una opción</option>
            <option value="superadmin">Super Administrador</option>
            <option value="admin">Administrador</option>
            <option value="personal">Personal de Apoyo</option>
            <option value="visitante">Visitante</option>
          </select>
        </div>
        <div class="form__column">
          <label class="form__label" for="IDtype">Tipo de Documento</label>
          <select id="IDtype" class="form__input" required>
            <option value="">Seleccione una opción</option>
            <option value="RC">RC</option>
            <option value="TI">TI</option>
            <option value="CC">CC</option>
            <option value="PASAPORTE">Pasaporte</option>
          </select>
        </div>
      </div>

      <div class="form__row">
        <div class="form__column">
          <label class="form__label" for="IDnum">Número de Documento</label>
          <input id="IDnum" class="form__input" type="text" required>
        </div>
        <div class="form__column">
          <label class="form__label" for="name">Nombre Completo</label>
          <input id="name" class="form__input" type="text" required>
        </div>
      </div>

      <div class="form__row">
        <div class="form__column">
          <label class="form__label" for="email">Correo Electrónico</label>
          <input id="email" class="form__input" type="email" required>
        </div>
        <div class="form__column">
          <label class="form__label" for="phone">Teléfono</label>
          <input id="phone" class="form__input" type="tel" pattern="\d{7,15}" required>
        </div>
      </div>

      <div class="form__row">
        <div class="form__column">
          <label class="form__label" for="password">Contraseña</label>
          <input id="password" class="form__input" type="password">
        </div>
        <div class="form__column">
          <label class="form__label" for="fecha_registro">Fecha Registro</label>
          <input id="fecha_registro" class="form__input" type="text" disabled>
        </div>
      </div>

      <div id="mensajeValidacion" class="form__message"></div>

      <div class="form__btn-group">
        <button type="submit" class="form__btn">Actualizar</button>
        <a href="listar.html" class="btn__secundary">Cancelar</a>
      </div>
    </form>
  </main>

  <!-- GOV inferior -->
  <div class="gov-bottom">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom">
  </div>

  <script>
    function showError(text) {
      const msg = document.getElementById('mensajeValidacion');
      msg.textContent = text;
      msg.classList.add('error');
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      if (!id) {
        alert("ID de usuario no proporcionado");
        return;
      }

      const form = document.getElementById("edit-user-form");
      const userId = document.getElementById("userId");
      const usertype = document.getElementById("usertype");
      const IDtype = document.getElementById("IDtype");
      const IDnum = document.getElementById("IDnum");
      const name = document.getElementById("name");
      const email = document.getElementById("email");
      const phone = document.getElementById("phone");
      const password = document.getElementById("password");
      const fechaRegistro = document.getElementById("fecha_registro");

      // Cargar datos existentes
      try {
        const res = await fetch(`http://localhost:3000/register/${id}`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        userId.value = data.id;
        usertype.value = data.usertype || "";
        IDtype.value = data.IDtype || "";
        IDnum.value = data.IDnum || "";
        name.value = data.name || "";
        email.value = data.email || "";
        phone.value = data.phone || "";
        fechaRegistro.value = data.fecha_registro
          ? new Date(data.fecha_registro).toLocaleDateString()
          : "";
      } catch {
        alert("Error al cargar datos de usuario");
        return;
      }

      form.addEventListener("submit", async e => {
        e.preventDefault();
        document.getElementById('mensajeValidacion').textContent = '';
        // Validaciones
        if (!usertype.value || !IDtype.value || !IDnum.value || !name.value 
            || !email.value || !phone.value) {
          showError("Todos los campos obligatorios deben estar llenos");
          return;
        }
        // IDnum numérico
        if (isNaN(IDnum.value)) {
          showError("El número de documento debe ser numérico");
          return;
        }
        const num = parseInt(IDnum.value, 10);
        if (num < 0) {
          showError("El número de documento debe ser mayor a 0");
          return;
        }
        if (IDnum.value.length < 7) {
          showError("El número de documento debe tener al menos 7 dígitos");
          return;
        }
        // Email
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email.value)) {
          showError("Correo electrónico no válido");
          return;
        }
        // Teléfono
        if (!/^\d{7,15}$/.test(phone.value)) {
          showError("El teléfono debe tener entre 7 y 15 dígitos");
          return;
        }

        // Preparar payload
        const payload = {
          usertype: usertype.value,
          IDtype: IDtype.value,
          IDnum: IDnum.value,
          name: name.value,
          email: email.value,
          phone: phone.value,
          password: password.value || null
        };

        try {
          const res = await fetch(`http://localhost:3000/register/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error();
          alert("✅ Usuario actualizado exitosamente");
          window.location.href = "listar.html";
        } catch {
          showError("Error al actualizar usuario");
        }
      });
    });
  </script>
</body>
</html>
