<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de Usuario</title>
  <link rel="stylesheet" href="/fronted/public/css/main.css">
  <link rel="stylesheet" href="/fronted/public/css/pages/crear.css">
  <script src="/fronted/public/views/components/header.js" defer></script>
</head>
<body>
  <div class="page__banner--top">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top" class="page__banner__img">
  </div>
  <header class="header"></header>

  <main class="form-container">
    <form class="form" id="registro-form" novalidate>
      <h2 class="form__title">Registro de Usuario</h2>
      <div class="form__row">
        <div class="form__column">
          <label class="form__label" for="usertype">Tipo de Usuario</label>
          <select id="usertype" name="usertype" class="form__input" required>
            <option value="">Seleccione una opción</option>
            <option value="superadmin">SUPERADMIN</option>
            <option value="admin">ADMIN</option>
            <option value="personal">Personal de Apoyo</option>
            <option value="visitante">Visitante</option>
          </select>

          <label class="form__label" for="IDtype">Tipo de Documento</label>
          <select id="IDtype" name="IDtype" class="form__input" required>
            <option value="">Seleccione una opción</option>
            <option value="RC">Cédula de Extranjería</option>
            <option value="TI">Tarjeta de Identidad</option>
            <option value="CC">Cédula de Ciudadanía</option>
            <option value="PASAPORTE">Pasaporte</option>
          </select>

          <label class="form__label" for="IDnum">Número de Documento</label>
          <input type="text" id="IDnum" name="IDnum" class="form__input" required>

          <label class="form__label" for="name">Nombre Completo</label>
          <input type="text" id="name" name="name" class="form__input" required>
        </div>

        <div class="form__column">
          <label class="form__label" for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" class="form__input" required>

          <label class="form__label" for="phone">Número de Teléfono</label>
          <input type="tel" id="phone" name="phone" class="form__input" pattern="\\d{7,15}" required>

          <label class="form__label" for="password">Contraseña</label>
          <input type="password" id="password" name="password" class="form__input" minlength="6" required>

          <label class="form__label" for="confirmPassword">Confirmar Contraseña</label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="form__input" required>
        </div>
      </div>

      <div id="mensajeValidacion" class="form__message"></div>

      <div class="form__btn-group">
        <button type="submit" class="form__btn">Registrar</button>
        <a href="../homes/index.html" class="btn__secundary">Cancelar</a>
      </div>
    </form>
  </main>

  <div class="page__banner--bottom">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom" class="page__banner__img">
  </div>

  <script>
    const showError = text => {
      const msg = document.getElementById('mensajeValidacion');
      msg.textContent = text;
      msg.classList.add('error');
    };

    document.getElementById('registro-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const msg = document.getElementById('mensajeValidacion');
      msg.textContent = '';
      msg.classList.remove('error');

      const form = e.target;
      const data = {
        usertype: form.usertype.value.trim(),
        IDtype: form.IDtype.value.trim(),
        IDnum: form.IDnum.value.trim(),
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        phone: form.phone.value.trim(),
        password: form.password.value,
        confirmPassword: form.confirmPassword.value
      };

      // validaciones
      if (!data.usertype || !data.IDtype || !data.IDnum || !data.name || !data.email || !data.phone || !data.password || !data.confirmPassword) {
        return showError('Todos los campos son obligatorios');
      }
      if (isNaN(data.IDnum) || parseInt(data.IDnum,10) < 0) {
        return showError('El número de documento debe ser numérico y mayor a 0');
      }
      if (data.IDnum.length < 7) {
        return showError('El número de documento debe tener al menos 7 dígitos');
      }
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(data.email)) {
        return showError('Correo electrónico no válido');
      }
      if (!/^\d{7,15}$/.test(data.phone)) {
        return showError('El teléfono debe tener entre 7 y 15 dígitos numéricos');
      }
      if (data.password.length < 6) {
        return showError('La contraseña debe tener al menos 6 caracteres');
      }
      if (data.password !== data.confirmPassword) {
        return showError('Las contraseñas no coinciden');
      }

      // petición AJAX
      try {
        const res = await fetch('http://localhost:3000/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            usertype: data.usertype,
            IDtype: data.IDtype,
            IDnum: data.IDnum,
            name: data.name,
            email: data.email,
            phone: data.phone,
            password: data.password
          })
        });
        const result = await res.json();
        if (!res.ok) {
          // mostrar mensaje de error sin redirigir
          showError(result.error || result.message || 'Error al registrar');
          return;
        }
        alert('✅ Usuario registrado exitosamente');
        window.location.href = '../homes/index.html';
      } catch (err) {
        console.error(err);
        showError('Error en la conexión');
      }
    });
  </script>
</body>
</html>
