<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar Sensores</title>
    <link rel="stylesheet" href="/fronted/public/css/components/visualizar.css"> 
    <script src="/fronted/public/views/components/header.js" defer></script>
</head>
<body>
    <div class="gov-top">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top">
    </div>
    <header class="header"></header>

    <main class="content-container">
        <h2 class="form__title">Sensores Registrados</h2>

        <div id="sensores-container" class="cards-container">
        </div>
    </main>
    <div class="gov-bottom">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom">
    </div>

    <script>
    (function () { 
        const userDataString = sessionStorage.getItem('userData');
        const user = userDataString ? JSON.parse(userDataString) : null;
        
        if (!user) { 
            window.location.href = '/fronted/public/views/usuarios/inicio_sesion.html'; 
            return; 
        } 
        
        const role = user.role; 
        
        const allowedRoles = ['visitante', 'personal', 'admin', 'superadmin'];
        
        if (!allowedRoles.includes(role)) {
            alert('Acceso Denegado: Su rol no tiene permiso para visualizar sensores.');
            window.location.href = '/fronted/public/views/homes/home.html';
            return; 
        }

        const btnLogout = document.getElementById('btnLogout');
        if (btnLogout) {
            btnLogout.onclick = function () { 
                sessionStorage.removeItem('userData');
                sessionStorage.removeItem('userToken');
                localStorage.removeItem('lembo_user_data');
                window.location.href = '/fronted/public/views/usuarios/inicio_sesion.html'; 
            };
        }
    })();
    </script>
    
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const response = await fetch("http://localhost:3000/sensores");
                if (!response.ok) throw new Error("Error al obtener sensores");

                const sensores = await response.json();
                const container = document.getElementById("sensores-container");
                container.innerHTML = "";

                if (sensores.length === 0) {
                    container.innerHTML = `<p class="no-sensores">No hay sensores registrados</p>`;
                    return;
                }

                const BASE_URL = "http://localhost:3000";

                sensores.forEach(s => {
                    const card = document.createElement("div");
                    card.classList.add("card");

                    card.innerHTML = `
                        <div class="card-image">
                            ${s.image ? `<img src="${BASE_URL}/uploads/${s.image}" alt="${s.nombreSensor}">` : `<div class="no-image">Sin imagen</div>`}
                        </div>
                        <div class="card-content">
                            <h3>${s.nombreSensor}</h3>
                            <p><strong>Tipo:</strong> ${s.tipoSensor}</p>
                            <p><strong>Unidad de Medida:</strong> ${s.unidadMedida || "-"}</p>
                            <p><strong>Descripción:</strong> ${s.descripcion || "-"}</p>
                            <p><strong>Estado:</strong> ${s.estado || "Desconocido"}</p>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Error cargando sensores:", error);

                const container = document.getElementById("sensores-container");
                container.innerHTML = `<p class="no-sensores">Error al cargar sensores. Verifique que el servidor esté corriendo.</p>`;
            }
        });
    </script>
</body>
</html>
