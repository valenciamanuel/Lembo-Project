<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Sensor</title>
    <link rel="stylesheet" href="/fronted/public/css/main.css">
    <script src="/fronted/public/views/components/header.js"></script>
    <link rel="stylesheet" href="/fronted/public/css/pages/crear.css">
</head>
<body>
    <header class="header"></header>

    <div class="page__banner--top">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top" class="page__banner__img">
    </div>

    <main class="form-container">
        <form class="form" id="edit-sensor-form" enctype="multipart/form-data">
            <h2 class="form__title">Editar Sensor</h2>
            <input type="hidden" id="sensorId">
            <input type="hidden" id="existingImageName">

            <div class="form__row">
                <div class="form__column">
                    <label class="form__label">Nombre del Sensor</label>
                    <input class="form__input" type="text" id="nombreSensor" name="nombreSensor">

                    <label class="form__label">Tipo de Sensor</label>
                    <select class="form__input" id="tipoSensor" name="tipoSensor" required>
                        <option value="">Seleccione un tipo</option>
                        <option value="Temperatura">Temperatura</option>
                        <option value="Humedad">Humedad</option>
                        <option value="pH">pH</option>
                        <option value="Luminosidad">Luminosidad</option>
                        <option value="CO2">CO₂</option>
                        <option value="Otro">Otro</option>
                    </select>

                    <label class="form__label">Unidad de Medida</label>
                    <select class="form__input" id="unidadMedida" name="unidadMedida" required>
                        <option value="">Seleccione una unidad</option>
                        <option value="°C">Grados Celsius (°C)</option>
                        <option value="%">Porcentaje (%)</option>
                        <option value="pH">pH</option>
                        <option value="Lux">Lux</option>
                        <option value="ppm">Partes por millón (ppm)</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>

                <div class="form__column">
                    <label class="form__label">Tiempo de Escaneo</label>
                    <input class="form__input" type="text" id="tiempoEscaneo" name="tiempoEscaneo">

                    <label class="form__label">Descripción</label>
                    <textarea class="form__input" id="descripcion" name="descripcion"></textarea>

                    <label class="form__label">Estado</label>
                    <select class="form__input" id="estado" name="estado">
                        <option value="">Seleccione una opción</option>
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>

                    <label class="form__label">Imagen (Solo selecciona si deseas cambiarla)</label>
                    <input type="file" class="form__input" id="image" name="image"> 
                    <div id="current-image-preview" style="margin-top: 5px;"></div>
                </div>
            </div>

            <div class="form__btn-group">
                <button type="submit" class="form__btn form__btn--registrar">Actualizar</button>
                <a href="listar_sensor.html" class="btn__secundary">Cancelar</a>
            </div>
        </form>
    </main>

    <script>
        (function () { 
            const userDataString = sessionStorage.getItem('userData');
            const user = userDataString ? JSON.parse(userDataString) : null;

            if (!user) { 
                window.location.href = '/fronted/public/views/usuarios/inicio_sesion.html'; 
                return; 
            } 

            const role = user.role; 
            const allowedRoles = ['admin', 'superadmin']; 

            if (!allowedRoles.includes(role)) {
                alert('Acceso Denegado: Su rol no tiene permiso para editar sensores.');
                window.location.href = '/fronted/public/views/homes/home.html';
                return; 
            }

            const btnLogout = document.getElementById('btnLogout');
            if (btnLogout) {
                btnLogout.onclick = function () { 
                    sessionStorage.removeItem('userData');
                    sessionStorage.removeItem('userToken');
                    localStorage.removeItem('lembo_user_data');
                    window.location.href = '/fronted/public/views/usuarios/inicio_sesion.html'; 
                };
            }
        })();
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const sensorId = urlParams.get('id');
            const form = document.getElementById('edit-sensor-form');
            const imageInput = document.getElementById('image');
            const previewContainer = document.getElementById('current-image-preview');
            const existingImageNameInput = document.getElementById('existingImageName');

            if (!sensorId) {
                alert('Error: No se encontró el ID del sensor.');
                return;
            }

            try {
                const response = await fetch(`http://localhost:3000/sensores/${sensorId}`);
                if (!response.ok) throw new Error('Error al obtener los datos del sensor.');
                const data = await response.json();

                // 1. Carga de datos del sensor
                document.getElementById('sensorId').value = data.idSensor;
                document.getElementById('nombreSensor').value = data.nombreSensor || "";
                document.getElementById('tipoSensor').value = data.tipoSensor || "";
                document.getElementById('unidadMedida').value = data.unidadMedida || "";
                document.getElementById('tiempoEscaneo').value = data.tiempoEscaneo || "";
                document.getElementById('descripcion').value = data.descripcion || "";
                document.getElementById('estado').value = data.estado || "";

                // 2. Manejo de la imagen existente
                if(data.image) {
                    // Guarda el nombre del archivo existente
                    existingImageNameInput.value = data.image; 
                    
                    // Muestra la previsualización
                    previewContainer.innerHTML = `<img src="/uploads/${data.image}" width="80" style="border-radius:6px; border: 1px solid #ccc;">
                                                  <p style="font-size: 0.8em; margin-top: 5px;">Imagen actual</p>`;
                } else {
                    existingImageNameInput.value = ''; // Asegura que esté vacío si no hay imagen
                }
            } catch (error) {
                console.error("❌Error cargando datos:", error);
                alert(`Error al cargar los datos: ${error.message}`);
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                // Validación simple de campos obligatorios
                const campos = ['nombreSensor', 'tipoSensor', 'unidadMedida', 'tiempoEscaneo', 'descripcion', 'estado'];
                for (const campo of campos) {
                    if (document.getElementById(campo).value.trim() === '') {
                        alert('Por favor, complete todos los campos.');
                        return;
                    }
                }
                
                const formData = new FormData();
                formData.append('nombreSensor', document.getElementById('nombreSensor').value);
                formData.append('tipoSensor', document.getElementById('tipoSensor').value);
                formData.append('unidadMedida', document.getElementById('unidadMedida').value);
                formData.append('tiempoEscaneo', document.getElementById('tiempoEscaneo').value);
                formData.append('descripcion', document.getElementById('descripcion').value);
                formData.append('estado', document.getElementById('estado').value);

                // Lógica de manejo de imagen:
                if(imageInput.files[0]) {
                    // Si el usuario selecciona un nuevo archivo, lo adjuntamos para subirlo.
                    formData.append('image', imageInput.files[0]);
                } else if (existingImageNameInput.value) {
                    // Si NO selecciona un nuevo archivo pero EXISTE una imagen anterior, 
                    // adjuntamos el nombre del archivo existente para que el backend sepa que debe conservarlo.
                    formData.append('image', existingImageNameInput.value);
                }
                // Si no había imagen y no se selecciona una, el campo 'image' simplemente se omite.


                try {
                    const response = await fetch(`http://localhost:3000/sensores/${sensorId}`, {
                        method: 'PUT',
                        body: formData
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'Error al actualizar el sensor.');
                    }

                    alert('Sensor actualizado exitosamente.');
                    window.location.href = 'listar_sensor.html';
                } catch (error) {
                    console.error("Error al actualizar el sensor:", error);
                    alert(`Error al actualizar: ${error.message}`);
                }
            });
        });
    </script>

    <div class="gov-bottom">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom">
    </div>
</body>
</html>
