<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Insumo</title>
  <link rel="stylesheet" href="/fronted/public/css/main.css">
  <script src="/fronted/public/views/components/header.js" defer></script>
  <script src="/fronted/public/js/insumo/enviar.js" defer></script>
  <style>
    .page__banner--top,
    .page__banner--bottom {
      position: fixed;
      left: 0;
      width: 100vw;
      z-index: 1000;
    }

    .page__banner--top {
      top: 0;
    }

    .page__banner--bottom {
      bottom: 0;
    }

    .page__banner__img {
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    header.header {
      position: fixed;
      margin-top: -2.4rem;
      top: 6rem;
      left: 0;
      width: 100%;
      z-index: 900;
    }

    main.form-container {
      margin: calc(6rem+6rem+2rem) auto 6rem;
      padding: 2rem;
      max-width: 700px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #4DB100;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .form__title {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      text-align: center;
      color: #222;
    }

    .form__row {
      display: flex;
      flex-wrap: wrap;
      gap: 1.6rem;
    }

    .form__column {
      flex: 1 1 45%;
      display: flex;
      flex-direction: column;
    }

    .form__label {
      margin-bottom: .5rem;
      font-size: 1.4rem;
      color: #222;
      text-align: left;
    }

    .form__input,
    .form__input--imagen {
      padding: .75rem 1rem;
      font-size: 1.4rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      margin-bottom: 1rem;
    }

    .form__input:focus {
      outline: none;
      border-color: #2d8500;
      box-shadow: 0 0 0 3px rgba(57, 169, 0, 0.2);
    }

    .form__btn-group {
      display: flex;
      justify-content: flex-end;
      gap: 1.6rem;
      margin-top: 2rem;
    }

    .form__btn {
      padding: .75rem 2rem;
      font-size: 1.6rem;
      background: #39a900;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background .2s, box-shadow .2s;
    }

    .form__btn:hover {
      background: #2d8500;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .btn__secundary {
      padding: .75rem 2rem;
      font-size: 1.6rem;
      background: #555;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background .2s;
    }

    .btn__secundary:hover {
      background: #333;
    }

    @media(max-width:768px) {
      main.form-container {
        margin: calc(6rem+6rem+1rem) 1rem 1rem;
        padding: 1rem;
      }

      .form__column {
        flex: 1 1 100%;
      }
    }
  </style>
</head>

<body>
  <div class="page__banner--top">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top" class="page__banner__img">
  </div>
  <header class="header"></header>
  <main class="form-container">
    <form class="form" id="crear-insumo-form">
      <h2 class="form__title">Datos Insumos</h2>
      <div class="form__row">
        <div class="form__column">
          <label class="form__label" for="image">Cargar imagen</label>
          <input class="form__input form__input--imagen" type="file" id="image" name="image" accept="image/*">

          <label class="form__label" for="tipoInsumo">Tipo insumo</label>
          <input class="form__input insumo__input--type" type="text" id="tipoInsumo" name="tipoInsumo">

          <label class="form__label" for="nombreInsumo">Nombre insumo</label>
          <input class="form__input insumo__input--nombre" type="text" id="nombreInsumo" name="nombreInsumo">

          <label class="form__label" for="unidadMedida">Unidad de medida</label>
          <input class="form__input insumo__input--unidad" type="text" id="unidadMedida" name="unidadMedida">

          <label class="form__label" for="cantidad">Cantidad</label>
          <input class="form__input insumo__input--cantidad" type="number" id="cantidad" name="cantidad">
        </div>

        <div class="form__column">
          <label class="form__label" for="valorUnitario">Valor unitario</label>
          <input class="form__input insumo__input--unitario" type="number" id="valorUnitario" name="valorUnitario">

          <label class="form__label" for="valorTotal">Valor Total</label>
          <input class="form__input insumo__input--total" type="number" id="valorTotal" name="valorTotal">

          <label class="form__label" for="descripcion">Descripción</label>
          <input class="form__input insumo__input--descripcion" type="text" id="descripcion" name="descripcion">

          <label class="form__label" for="estado">Estado (activo / inactivo)</label>
          <select name="estado" id="estado" class="form__input insumo__input--estado">
            <option value="">Seleccione una opción</option>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
          </select>
        </div>
      </div>
      <div class="form__btn-group">
        <button type="submit" class="form__btn form__btn--registrar">Crear</button>
        <a href="../homes/home-insumos.html" class="btn__secundary">Cancelar</a>
      </div>
    </form>
  </main>
  <div class="page__banner--bottom">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom" class="page__banner__img">
  </div>
</body>

</html>
