<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Sensores</title>
    <link rel="stylesheet" href="/fronted/public/css/pages/homes/stylieshome-insumos-sensores.css" />
    <script src="/fronted/public/views/components/grid.js"></script>
    
</head>

<body>
    <header class="header"> <img src="/fronted/public/img/logo-de-Sena-sin-fondo-Blanco-300x300.png" alt="Logo SENA"
            class="header__logo">
        <nav class="header__nav"> <a href="index.html" class="header__link">Inicio</a> <a href="home-insumos.html"
                class="header__link">Insumos</a> <a href="home-cultivo-3.html" class="header__link">Cultivos</a> <a
                id="btnLogout" class="header__link" style="cursor:pointer">Cerrar Sesión</a> </nav>
    </header>
    <div class="header-banner"> <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top" class="header-banner__img">
    </div>
    <main class="background">
        <section class="top-boxes">
            <div class="top-boxes__item"><a href="../sensores/crear_sensor.html">Crear sensor</a></div>
            <div class="top-boxes__item"><a href="../sensores/visualizar_sensores.html">Visualizar sensor</a></div>
            <div class="top-boxes__item"><a href="../sensores/listar_sensor.html">Listar sensor</a></div>
        </section>
        <div class="grid"></div>
    </main>
    <div class="footer-banner"> <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom"
            class="footer-banner__img"> </div>

    <script>
        (function () {
            // 🔑 CLAVE: Intentamos leer la clave 'userData' de sessionStorage (donde se guarda en el login)
            const userDataString = sessionStorage.getItem('userData');
            
            // Si userDataString está vacío, el login fue fallido o el usuario no está logueado
            const user = userDataString ? JSON.parse(userDataString) : null;
            
            if (!user) {
                // Redirige al login si no hay datos de usuario
                window.location.href = '/fronted/public/views/usuarios/inicio_sesion.html';
                return;
            }

            const role = user.role; 

            // Se asume que el token y los datos del usuario están en sessionStorage
            // Si el login guarda el token con otra clave (ej: userToken), puedes necesitar leer ambas.

            const rules = {
                visitante: [
                    'Inicio',
                    'Sensores',
                    'Visualizar sensor',
                    'Insumos', 
                    'Cultivos'
                ],
                personal: [
                    'Sensores',
                    'Crear sensor',       // Asegúrate de incluir las opciones correctas
                    'Visualizar sensor',  // en el menú superior y en las cajas
                    'Listar sensor'
                ],
                admin: [
                    'Inicio', 
                    'Insumos', 
                    'Cultivos', 
                    'Crear sensor', 
                    'Visualizar sensor', 
                    'Listar sensor'
                ],
                
                superadmin: [
                    'Registrar usuario', 
                    'Listar usuarios',
                    'Ciclo Cultivo',
                    'Asociación',
                    'Sensores',
                    'Insumos',
                    'Cultivos',
                    'Crear sensor',
                    'Visualizar sensor',
                    'Listar sensor',
                    'Producción' 
                ]
            }; 
            
            // Lógica para filtrar enlaces del Header
            document.querySelectorAll('.header__link').forEach(link => {
                const txt = link.textContent.trim();
                if (txt === 'Cerrar Sesión') return;
                // 'Sensores' no es un enlace en el header, pero lo dejé para evitar error de rol
                if (!rules[role] || !rules[role].includes(txt)) link.remove();
            });
            
            // Lógica para filtrar cajas de acceso rápido (top-boxes)
            document.querySelectorAll('.top-boxes__item a').forEach(a => {
                const txt = a.textContent.trim();
                if (!rules[role] || !rules[role].includes(txt)) a.parentElement.remove();
            });
            
            // Lógica para Cerrar Sesión (Limpieza de sessionStorage)
            document.getElementById('btnLogout').onclick = () => {
                sessionStorage.removeItem('userData');
                sessionStorage.removeItem('userToken'); // Si usas esta clave, también debe eliminarse
                localStorage.removeItem('lembo_user_data'); // Limpieza de la clave antigua
                
                window.location.href = '/fronted/public/views/usuarios/inicio_sesion.html';
            };
        })(); 
    </script>


</body>

</html>
