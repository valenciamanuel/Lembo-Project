<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizar Sensores</title>
  <link rel="stylesheet" href="/css/components/visualizar.css">
  <script src="/fronted/public/views/components/header.js" defer></script>
  <link rel="stylesheet" href="/fronted/public/css/components/visualizar.css">

</head>
<body>
  <header class="header"></header>

  <main class="content-container">
    <h2 class="form__title">Sensores Registrados</h2>

    <div id="sensores-container" class="cards-container">
      <!-- Aquí JS insertará cada card -->
    </div>
  </main>

  <!-- ✅ JS embebido -->
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        // ⚠️ Asegúrate que en server.js usaste /sensores
        const response = await fetch("http://localhost:3000/sensores");
        if (!response.ok) throw new Error("Error al obtener sensores");

        const sensores = await response.json();
        const container = document.getElementById("sensores-container");
        container.innerHTML = "";

        if (sensores.length === 0) {
          container.innerHTML = `<p class="no-sensores">No hay sensores registrados</p>`;
          return;
        }

        sensores.forEach(s => {
          const card = document.createElement("div");
          card.classList.add("card");

          card.innerHTML = `
            <div class="card-image">
              ${s.image ? `<img src="/uploads/${s.image}" alt="${s.nombre}">` : `<div class="no-image">Sin imagen</div>`}
            </div>
            <div class="card-content">
              <h3>${s.nombre}</h3>
              <p><strong>Tipo:</strong> ${s.tipo}</p>
              <p><strong>Ubicación:</strong> ${s.ubicacion || "-"}</p>
              <p><strong>Estado:</strong> ${s.estado || "Desconocido"}</p>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (error) {
        console.error("❌ Error cargando sensores:", error);

        const container = document.getElementById("sensores-container");
        container.innerHTML = `<p class="no-sensores">Error al cargar sensores</p>`;
      }
    });
  </script>
</body>
</html>
