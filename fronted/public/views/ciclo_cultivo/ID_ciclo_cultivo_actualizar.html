<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Ciclo Cultivo</title>
    <link rel="stylesheet" href="/fronted/public/css/pages/ciclo_cultivo/style_ID__ciclo_cultivo.css">
</head>
<body>
    <!-- Barra GOV superior -->
    <div class="gov-top">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="Gov Top">
    </div>

    <!-- Header verde -->
    <header class="header">
        <img class="header__logo" src="/fronted/public/img/logo-de-Sena-sin-fondo-Blanco-300x300.png" alt="Logo SENA">
    </header>

    <!-- Contenedor principal -->
    <main class="main">
        <div class="ciclo-cultivo">
            <div class="ciclo-cultivo__imagen"></div>

            <div class="ciclo-cultivo__form">
                <label class="ciclo-cultivo__label" for="idCiclo">ID Ciclo Cultivo</label>
                <input class="ciclo-cultivo__input" type="text" id="idCiclo">

                <div id="mensaje" class="mensaje"></div>

                <button id="enviarBtn" class="ciclo-cultivo__button">Enviar</button>
            </div>
        </div>
    </main>

    <!-- Footer verde -->
    <footer class="footer">
        Sistema SENA - Ciclo Cultivo
    </footer>

    <!-- Barra GOV inferior -->
    <div class="gov-bottom">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="Gov Bottom">
    </div>

    <script src="/fronted/public/js/ciclo_cultivo/validacion_actualizar.js"></script>
</body>
</html>
<!-- css la idea esque todo los id queden lo mismo  -->
