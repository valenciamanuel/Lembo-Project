<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Sensor</title>
    <link rel="stylesheet" href="/fronted/public/css/pages/sensores/style_ID_sensores.css">
 <!--    <link rel="stylesheet" href="/fronted/public/css/components/header.css"> -->
</head>
<body>
    <div class="gov-top">
     <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top">
    </div>
    <header class="header">
        <img class="header__logo" src="/fronted/public/img/logo-de-Sena-sin-fondo-Blanco-300x300.png" alt="Logo SENA">
    </header>

    <main>
        <div class="sensor-content">
            <div class="sensor-content__image"></div>
            
            <div class="sensor-content__id-box">
                <label class="sensor-content__label">ID Sensor</label>
                <input class="sensor-content__input" type="text" id="idSensor">
                
                <div id="mensaje" class="sensor-content__mensaje"></div>

                <button id="enviarBtn" class="sensor-content__button">
                    <a href="datos_sensor.html" class="sensor-content__button-link">Enviar</a>
                </button>
            </div>
        </div>
    </main>
    <!-- GOV inferior -->
    <div class="gov-bottom">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Colombia">
    </div>

    <script src="/fronted/public/js/sensores/validacion_actualizar.js"></script>
</body>
</html>
