<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios Registrados</title>
  <link rel="stylesheet" href="/css/components/listar.css">
  <script src="/fronted/public/views/components/header.js" defer></script>
  <link rel="stylesheet" href="/fronted/public/css/components/listar.css">
</head>
<body>
      <!-- Barra GOV superior -->
  <div class="gov-top">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top">
  </div>
  <header class="header"></header>
  

  <main class="content-container">
    <h2 class="form__title">Usuarios Registrados</h2>

    <table class="styled-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Tipo Usuario</th>
          <th>Tipo Doc</th>
          <th>Número Doc</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Teléfono</th>
          <th>Fecha Registro</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="usuarios-table-body">
        <tr><td colspan="9">Cargando usuarios...</td></tr>
      </tbody>
    </table>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        // 👇 Aquí usas tu endpoint real
        const res = await fetch("http://localhost:3000/register");
        if (!res.ok) throw new Error("Error al obtener usuarios");

        const usuarios = await res.json();
        const tbody = document.getElementById("usuarios-table-body");
        tbody.innerHTML = "";

        if (usuarios.length === 0) {
          tbody.innerHTML = `<tr><td colspan="9">No hay usuarios registrados</td></tr>`;
          return;
        }

        usuarios.forEach(u => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${u.id}</td>
            <td>${u.usertype}</td>
            <td>${u.IDtype}</td>
            <td>${u.IDnum}</td>
            <td>${u.name}</td>
            <td>${u.email}</td>
            <td>${u.phone}</td>
            <td>${u.fecha_registro ? new Date(u.fecha_registro).toLocaleDateString() : "-"}</td>
            <td>
              <a href="actualizar_perfil.html?id=${u.id}" class="edit-link">Editar</a>
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch (error) {
        console.error("❌ Error cargando usuarios:", error);
        document.getElementById("usuarios-table-body").innerHTML = `
          <tr><td colspan="9">Error al cargar usuarios</td></tr>
        `;
      }
    });
  </script>
</body>
</html>
    <!-- Barra GOV inferior -->
    <div class="gov-bottom">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom">
    </div>
