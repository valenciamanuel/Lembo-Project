<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Insumo</title>
  <link rel="stylesheet" href="/fronted/public/css/main.css">
  <link rel="stylesheet" href="/fronted/public/css/pages/editar.css">
  <script src="/fronted/public/views/components/header.js" defer></script>
  <style>
    .form__message.error { color: #dc3545; margin-bottom: 1rem; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="gov-top">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top">
  </div>
  <header class="header"></header>

  <main class="form-container">
    <form class="form" id="edit-insumo-form" enctype="multipart/form-data" novalidate>
      <h2 class="form__title">Editar Insumo</h2>
      <div id="mensajeValidacion" class="form__message"></div>
      <input type="hidden" id="idInsumo">

      <div class="form__row">
        <div class="form__column">
          <label class="form__label" for="imageFile">Imagen</label>
          <input class="form__input" type="file" id="imageFile" name="image" accept="image/*">

          <label class="form__label" for="tipoInsumo">Tipo de Insumo</label>
          <input class="form__input" type="text" id="tipoInsumo" name="tipoInsumo" required>

          <label class="form__label" for="nombreInsumo">Nombre del Insumo</label>
          <input class="form__input" type="text" id="nombreInsumo" name="nombreInsumo" required>
        </div>
        <div class="form__column">
          <label class="form__label" for="unidadMedida">Unidad de Medida</label>
          <input class="form__input" type="text" id="unidadMedida" name="unidadMedida" required>

          <label class="form__label" for="cantidad">Cantidad</label>
          <input class="form__input" type="number" id="cantidad" name="cantidad" step="0.01" required>
        </div>
      </div>

      <div class="form__row">
        <div class="form__column">
          <label class="form__label" for="valorUnitario">Valor Unitario</label>
          <input class="form__input" type="number" id="valorUnitario" name="valorUnitario" step="0.01" required>
        </div>
        <div class="form__column">
          <label class="form__label" for="valorTotal">Valor Total</label>
          <input class="form__input" type="number" id="valorTotal" name="valorTotal" step="0.01" required>
        </div>
      </div>

      <div class="form__row">
        <div class="form__column">
          <label class="form__label" for="descripcion">Descripción</label>
          <textarea class="form__input" id="descripcion" name="descripcion" required></textarea>
        </div>
        <div class="form__column">
          <label class="form__label" for="estado">Estado</label>
          <select class="form__input" id="estado" name="estado" required>
            <option value="">Seleccione</option>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
          </select>
        </div>
      </div>

      <div class="form__btn-group">
        <button type="submit" class="form__btn form__btn--registrar">Actualizar</button>
        <a href="listar_insumo.html" class="btn__secundary">Cancelar</a>
      </div>
    </form>
  </main>

  <div class="gov-bottom">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom">
  </div>

  <script>
    const showError = text => {
      const msg = document.getElementById('mensajeValidacion');
      msg.textContent = text;
      msg.classList.add('error');
    };

    document.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) { alert('ID no proporcionado'); return; }

      const form = document.getElementById('edit-insumo-form');
      const fields = ['tipoInsumo','nombreInsumo','unidadMedida','cantidad','valorUnitario','valorTotal','descripcion','estado'];
      // Cargar datos
      try {
        const res = await fetch(`http://localhost:3000/insumo/${id}`);
        if (!res.ok) throw Error();
        const data = await res.json();
        document.getElementById('idInsumo').value = data.idInsumo;
        fields.forEach(f => {
          const el = document.getElementById(f);
          if (el) el.value = data[f] ?? '';
        });
      } catch {
        alert('Error cargando datos');
        return;
      }

      form.addEventListener('submit', async e => {
        e.preventDefault();
        document.getElementById('mensajeValidacion').textContent='';

        // Validaciones
        for (const f of fields) {
          const el = document.getElementById(f);
          if (!el.value.trim()) { showError('Todos los campos obligatorios deben llenarse'); return; }
        }
        const num = parseFloat(document.getElementById('cantidad').value);
        if (isNaN(num) || num<=0) { showError('Cantidad > 0'); return; }
        const vu = parseFloat(document.getElementById('valorUnitario').value);
        if (isNaN(vu) || vu<0) { showError('Valor unitario >= 0'); return; }
        const vt = parseFloat(document.getElementById('valorTotal').value);
        if (isNaN(vt) || vt<0) { showError('Valor total >= 0'); return; }
        if (document.getElementById('descripcion').value.trim().length<3) {
          showError('Descripción muy corta'); return;
        }

        // FormData
        const formData = new FormData();
        formData.append('tipoInsumo', document.getElementById('tipoInsumo').value);
        formData.append('nombreInsumo', document.getElementById('nombreInsumo').value);
        formData.append('unidadMedida', document.getElementById('unidadMedida').value);
        formData.append('cantidad', document.getElementById('cantidad').value);
        formData.append('valorUnitario', document.getElementById('valorUnitario').value);
        formData.append('valorTotal', document.getElementById('valorTotal').value);
        formData.append('descripcion', document.getElementById('descripcion').value);
        formData.append('estado', document.getElementById('estado').value);
        const file = document.getElementById('imageFile').files[0];
        if (file) formData.append('image', file);

        try {
          const resp = await fetch(`http://localhost:3000/insumo/${id}`, {
            method:'PUT',
            body: formData
          });
          if (!resp.ok) {
            const e = await resp.json();
            throw new Error(e.error||'Error al actualizar');
          }
          alert('Insumo actualizado');
          window.location.href='listar_insumo.html';
        } catch (err) {
          showError(err.message);
        }
      });
    });
  </script>
</body>
</html>
