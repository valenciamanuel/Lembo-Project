<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizar Uso de Insumos</title>
  <link rel="stylesheet" href="/css/components/visualizar.css">
  <script src="/fronted/public/views/components/header.js" defer></script>
  <link rel="stylesheet" href="/fronted/public/css/components/visualizar.css">

</head>
<body>
  <div class="gov-top">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top">
  </div>
  <header class="header"></header>

  <main class="content-container">
    <h2 class="form__title">Uso de Insumos Registrados</h2>

    <div id="uso-insumo-container" class="cards-container">
      <!-- Aquí JS insertará cada card -->
    </div>
  </main>
  <div class="gov-bottom">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom">
  </div>

  <!-- ✅ JS embebido -->
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        // ⚠️ Ajusta la ruta según tu server.js
        const response = await fetch("http://localhost:3000/uso_insumo");
        if (!response.ok) throw new Error("Error al obtener uso de insumos");

        const usos = await response.json();
        const container = document.getElementById("uso-insumo-container");
        container.innerHTML = "";

        if (usos.length === 0) {
          container.innerHTML = `<p class="no-uso">No hay registros de uso de insumos</p>`;
          return;
        }

        usos.forEach(u => {
          const card = document.createElement("div");
          card.classList.add("card");

          card.innerHTML = `
            <div class="card-content">
              <h3>📦 ${u.insumo}</h3>
              <p><strong>Fecha de uso:</strong> ${u.fecha_uso}</p>
              <p><strong>Cantidad:</strong> ${u.cantidad}</p>
              <p><strong>Responsable:</strong> ${u.responsable}</p>
              <p><strong>Valor Unitario:</strong> $${u.valor_unitario}</p>
              <p><strong>Valor Total:</strong> $${u.valor_total}</p>
              <p><strong>Observaciones:</strong> ${u.observaciones || "-"}</p>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (error) {
        console.error("❌ Error cargando uso de insumos:", error);

        const container = document.getElementById("uso-insumo-container");
        container.innerHTML = `<p class="no-uso">Error al cargar uso de insumos</p>`;
      }
    });
  </script>
</body>
</html>
