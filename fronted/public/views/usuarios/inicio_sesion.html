<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="/fronted/public/css/pages/usuarios/inicio_sesion1.css">
</head>

<body>
    <div class="gov-top">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top">
    </div>
    <header class="header">
        <img src="/fronted/public/img/logo-de-Sena-sin-fondo-Blanco-300x300.png" alt="Logo SENA" class="logo-sena">
    </header>
    <main class="form-container">
        <form class="form" id="loginForm">
            <h2 class="form-title">Iniciar Sesión</h2>
            <div class="form__row">
                <div>
                    <label class="form__label" for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" class="form__input" required>
                </div>
                <div>
                    <label class="form__label" for="contraseña">Contraseña</label>
                    <input type="password" id="contraseña" name="contraseña" class="form__input" required>
                </div>
            </div>
            <div id="mensajeValidacion" class="form__message"></div>
            <div class="form__btn-group">
                <button type="submit" class="form__btn form__btn--registrar">Iniciar Sesión</button>
            </div>
            <div class="form__row" style="margin-top: 1rem; text-align:center;">
                <a href="#" id="forgotPassword" class="form__link">¿Olvidaste tu contraseña?</a>
            </div>
        </form>
    </main>
    <div class="gov-bottom">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom">
    </div>

    <script>
        // -----------------------------------------------------------
        // FUNCIONES DE SOPORTE
        // -----------------------------------------------------------
        const messageContainer = document.getElementById('mensajeValidacion');

        function showMessage(text, type) {
            messageContainer.textContent = text;
            messageContainer.className = `form__message form__message--${type}`; 
            messageContainer.style.display = 'block';
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        // -----------------------------------------------------------
        // LÓGICA DE INICIO DE SESIÓN (Usando URL ABSOLUTA)
        // -----------------------------------------------------------
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('correo').value.trim(); 
            const password = document.getElementById('contraseña').value;
            
            showMessage('Validando datos...', 'info');

            // Validaciones de datos
            if (!email || !password) {
                showMessage('Correo y contraseña son obligatorios.', 'error');
                return;
            }
            if (!validateEmail(email)) {
                showMessage("Ingrese un correo válido.", "error");
                return;
            }
            if (password.length < 6) { 
                showMessage("La contraseña debe tener al menos 6 caracteres.", "error");
                return;
            }
            
            showMessage("Iniciando sesión...", "info");

            try {
                // 🔑 CLAVE: Usamos la URL ABSOLUTA (http://localhost:3000)
                const resp = await fetch('http://localhost:3000/register/login', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password }) 
                });
                
                const result = await resp.json();

                if (!resp.ok) {
                    const errorMessage = result.message || 'Credenciales incorrectas o error desconocido.';
                    showMessage(errorMessage, 'error');
                    return;
                }

                // ÉXITO: Guardamos el token y redirigimos
                if (result.token) {
                    sessionStorage.setItem('userToken', result.token); 
                    sessionStorage.setItem('userData',
                        JSON.stringify({ id: result.id, email: result.email, role: result.usertype })
                    );

                    showMessage('Inicio de sesión exitoso. Redirigiendo...', 'success');

                    setTimeout(() => {
                        location.href = '/fronted/public/views/homes/index.html'; 
                    }, 500);

                } else {
                     showMessage('Error: No se recibió un token de autenticación del servidor.', 'error');
                }

            } catch (err) {
                console.error('Error de conexión durante el login:', err);
                // Si este error persiste, verifica que el puerto 3000 esté disponible
                showMessage('Error al conectar con el servidor. Verifique que el Backend esté encendido.', 'error');
            }
        });

        // -----------------------------------------------------------
        // LÓGICA DE RECUPERAR CONTRASEÑA (Usando URL ABSOLUTA)
        // -----------------------------------------------------------
        document.getElementById('forgotPassword').addEventListener('click', async function (e) {
            e.preventDefault();
            const correo = prompt('Ingrese su correo electrónico para recuperar la contraseña:');
            
            if (!correo) return;

            try {
                // 🔑 CLAVE: Usamos la URL ABSOLUTA
                const resp = await fetch('http://localhost:3000/register/recuperar', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: correo })
                });

                const result = await resp.json();
                const type = resp.ok ? 'success' : 'error';
                const text = resp.ok ? (result.message || 'Se ha enviado una contraseña temporal a tu correo') : (result.message || 'Error al recuperar contraseña');
                
                showMessage(text, type);

            } catch (err) {
                showMessage('Error de conexión al intentar recuperar la contraseña.', 'error');
            }
        });
    </script>
</body>
</html>
