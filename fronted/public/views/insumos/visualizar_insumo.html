<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizar Insumos</title>
  <link rel="stylesheet" href="/css/components/visualizar.css">
  <script src="/fronted/public/views/components/header.js" defer></script>
  <link rel="stylesheet" href="/fronted/public/css/components/visualizar.css">

</head>
<body>
  <header class="header"></header>

  <main class="content-container">
    <h2 class="form__title">Insumos Registrados</h2>

    <div id="insumos-container" class="cards-container">
      <!-- Aquí JS insertará cada card -->
    </div>
  </main>

  <!-- ✅ JS embebido -->
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        // ⚠️ Usa /insumo o /insumos según tu server.js
        const response = await fetch("http://localhost:3000/insumo");
        if (!response.ok) throw new Error("Error al obtener insumos");

        const insumos = await response.json();
        const container = document.getElementById("insumos-container");
        container.innerHTML = "";

        if (insumos.length === 0) {
          container.innerHTML = `<p class="no-insumos">No hay insumos registrados</p>`;
          return;
        }

        insumos.forEach(i => {
          const card = document.createElement("div");
          card.classList.add("card");

          card.innerHTML = `
            <div class="card-image">
              ${i.image ? `<img src="/uploads/${i.image}" alt="${i.nombre}">` : `<div class="no-image">Sin imagen</div>`}
            </div>
            <div class="card-content">
              <h3>${i.nombre}</h3>
              <p><strong>Descripción:</strong> ${i.descripcion}</p>
              <p><strong>Cantidad:</strong> ${i.cantidad}</p>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (error) {
        console.error("❌ Error cargando insumos:", error);

        const container = document.getElementById("insumos-container");
        container.innerHTML = `<p class="no-insumos">Error al cargar insumos</p>`;
      }
    });
  </script>
</body>
</html>
