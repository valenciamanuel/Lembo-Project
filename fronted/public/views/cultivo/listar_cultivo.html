<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar Cultivos</title>
    <link rel="stylesheet" href="/fronted/public/css/components/listar.css">
    <script src="/fronted/public/views/components/header.js" defer></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>
    <script>
        let currentUserRole = null;

        (function () {
            const userDataString = sessionStorage.getItem('userData');
            const user = userDataString ? JSON.parse(userDataString) : null;

            // 1. COMPROBAR INICIO DE SESIÓN
            if (!user) {
                window.location.href = '/fronted/public/views/usuarios/inicio_sesion.html';
                return;
            }
            currentUserRole = user.role;
        })();
    </script>

    <div class="gov-top">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top">
    </div>

    <h1 class="h1">Mi título</h1>
    <header class="header"></header>

    <main class="content-container">
        <h2 class="form__title">Cultivos Registrados</h2>

        <div class="action-buttons" id="management-actions">
            <a href="../cultivo/crear_cultivo.html" class="btn btn-primary">
                <i class="material-icons">add</i> Agregar Cultivo
            </a>
            <button class="btn btn-success" onclick="exportToPDF()">
                <i class="material-icons">picture_as_pdf</i> Descargar PDF
            </button>
            <button class="btn btn-success" onclick="exportToExcel()">
                <i class="material-icons">table_chart</i> Descargar Excel
            </button>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
        </div>

        <table class="styled-table" id="cultivos-table-container">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Tipo</th>
                    <th>Código</th>
                    <th>Tamaño (m²)</th>
                    <th>Ubicación</th>
                    <th>Estado</th>
                    <th>Imagen</th>
                    <th id="actions-header">Acciones</th>
                </tr>
            </thead>
            <tbody id="cultivos-table"></tbody>
        </table>
    </main>

    <div class="gov-bottom">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom">
    </div>

    <script>
        let cultivosData = [];
        const managementRoles = ['admin', 'superadmin'];
        const isManager = managementRoles.includes(currentUserRole);

        document.addEventListener("DOMContentLoaded", () => {
            if (!isManager) {
                document.getElementById('management-actions').style.display = 'none';
                document.getElementById('actions-header').style.display = 'none';
            }
            loadCultivos();
        });

        async function loadCultivos() {
            const loader = document.getElementById("loader");
            const tableContainer = document.getElementById("cultivos-table-container");
            loader.classList.add("show");
            tableContainer.style.display = "none";

            try {
                const res = await fetch("http://localhost:3000/cultivo");
                if (!res.ok) throw new Error();
                cultivosData = await res.json();
                const tbody = document.getElementById("cultivos-table");
                tbody.innerHTML = "";

                if (cultivosData.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="${isManager ? 9 : 8}">No hay cultivos registrados</td></tr>`;
                } else {
                    cultivosData.forEach(c => {
                        const actionButtons = isManager ? `
                        <td class="actions-cell">
                            <button class="btn btn-warning btn-sm" onclick="editCultivo(${c.id})" title="Editar">
                                <i class="material-icons">edit</i>
                            </button>
                            <button class="btn ${c.state==='Activo'?'btn-danger':'btn-success'} btn-sm"
                                    onclick="toggleCultivo(${c.id},'${c.state}')"
                                    title="${c.state==='Activo'?'Desactivar':'Activar'}">
                                <i class="material-icons">${c.state==='Activo'?'visibility_off':'visibility'}</i>
                            </button>
                        </td>` : '';

                        const row = document.createElement("tr");
                        row.innerHTML = `
                            <td>${c.cultivoName}</td>
                            <td>${c.cultivoType}</td>
                            <td>${c.cultivoID}</td>
                            <td>${c.size}</td>
                            <td>${c.location}</td>
                            <td>
                                <span class="status-badge ${c.state==='Activo'?'status-activo':'status-inactivo'}">
                                    ${c.state}
                                </span>
                            </td>
                            <td>
                                ${c.image ? `<img src="/fronted/public/uploads/${c.image}" alt="Imagen de ${c.cultivoName}" width="60" style="border-radius:6px; object-fit:cover;">` : 'Sin imagen'}
                            </td>
                            ${actionButtons}
                        `;
                        tbody.appendChild(row);
                    });
                }
            } catch {
                document.getElementById("cultivos-table").innerHTML =
                    `<tr><td colspan="${isManager ? 9 : 8}" style="color:#dc3545;">Error cargando cultivos</td></tr>`;
            } finally {
                loader.classList.remove("show");
                tableContainer.style.display = "table";
            }
        }

        function editCultivo(id) {
            if (!isManager) return alert('Acceso Denegado.');
            window.location.href = `../cultivo/datos_cultivo.html?id=${id}`;
        }

        async function toggleCultivo(id, current) {
            if (!isManager) return alert('Acceso Denegado.');

            try {
                const cultivo = cultivosData.find(x => x.id === id);
                const newState = current === 'Activo' ? 'Inactivo' : 'Activo';
                const body = {
                    cultivoType: cultivo.cultivoType,
                    cultivoName: cultivo.cultivoName,
                    cultivoID: cultivo.cultivoID,
                    size: cultivo.size,
                    location: cultivo.location,
                    description: cultivo.description,
                    state: newState
                };
                const res = await fetch(`http://localhost:3000/cultivo/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!res.ok) throw new Error();
                await loadCultivos();
                alert(`Cultivo ${newState === 'Activo' ? 'activado' : 'desactivado'} correctamente`);
            } catch {
                alert('Error al cambiar estado');
            }
        }

        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(18);
            doc.text('Cultivos Registrados', 14, 20);
            doc.setFontSize(11);
            doc.text(`Fecha: ${new Date().toLocaleDateString()}`, 14, 28);

            const rows = cultivosData.map(c => [c.id, c.cultivoName, c.cultivoType, c.cultivoID, c.size, c.location, c.state]);

            doc.autoTable({
                head: [['ID', 'Nombre', 'Tipo', 'Código', 'Tamaño', 'Ubicación', 'Estado']],
                body: rows,
                startY: 35,
                theme: 'grid',
                headStyles: { fillColor: [57, 169, 0] },
                styles: { fontSize: 9 }
            });

            doc.save('cultivos.pdf');
        }

        function exportToExcel() {
            const data = cultivosData.map(c => ({
                ID: c.id,
                Nombre: c.cultivoName,
                Tipo: c.cultivoType,
                Código: c.cultivoID,
                Tamaño: c.size,
                Ubicación: c.location,
                Estado: c.state
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Cultivos');
            XLSX.writeFile(wb, 'cultivos.xlsx');
        }
    </script>
</body>

</html>
