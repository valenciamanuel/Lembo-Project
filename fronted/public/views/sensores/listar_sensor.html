<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar Sensores</title>
    <link rel="stylesheet" href="/css/components/listar.css">
    <link rel="stylesheet" href="/fronted/public/css/components/listar.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="/fronted/public/views/components/header.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="gov-top">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top">
    </div>

    <header class="header"></header>

    <main class="content-container">
        <h2 class="form__title">Sensores Registrados</h2>

        <div class="action-buttons" id="admin-actions">
            <a href="../sensores/crear_sensor.html" class="btn btn-primary">
                <i class="material-icons">add</i> Agregar Sensor
            </a>
            <button class="btn btn-success" onclick="exportToPDF()">
                <i class="material-icons">picture_as_pdf</i> Descargar PDF
            </button>
            <button class="btn btn-success" onclick="exportToExcel()">
                <i class="material-icons">table_chart</i> Descargar Excel
            </button>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
        </div>

        <table class="styled-table" id="sensores-table-container">
            <thead>
                <tr>
                    <th>Tipo</th>
                    <th>Nombre</th>
                    <th>Unidad de Medida</th>
                    <th>Tiempo de Escaneo (seg)</th>
                    <th>Descripción</th>
                    <th>Estado</th>
                    <th>Imagen</th>
                    <th class="actions-header" id="actions-header">Acciones</th>
                </tr>
            </thead>
            <tbody id="sensores-table"></tbody>
        </table>
    </main>

    <footer class="footer">
        <p>Sistema de Gestión Agrícola - LEMBO &copy; 2025</p>
    </footer>

    <div class="gov-bottom">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom">
    </div>

    <script>
        let userRole = null;

        (function() {
            const userDataString = sessionStorage.getItem('userData');
            const user = userDataString ? JSON.parse(userDataString) : null;

            if (!user) {
                window.location.href = '/fronted/public/views/usuarios/inicio_sesion.html';
                return;
            }

            userRole = user.role;
            const adminElements = document.querySelectorAll('#admin-actions, #actions-header');
            const allowedRoles = ['admin', 'superadmin'];

            if (!allowedRoles.includes(userRole)) {
                adminElements.forEach(el => {
                    if(el.id === 'actions-header') {
                        el.style.display = 'none';
                    } else {
                        el.remove();
                    }
                });
            }
        })();
    </script>

    <script>
        let sensoresData = [];
        const allowedToAct = ['admin', 'superadmin'];

        document.addEventListener("DOMContentLoaded", async () => {
            if (!window.location.href.includes('inicio_sesion.html')) {
                await loadSensores();
            }
        });

        async function loadSensores() {
            const loader = document.getElementById("loader");
            const tableContainer = document.getElementById("sensores-table-container");

            try {
                loader.classList.add("show");
                tableContainer.style.display = "none";

                const response = await fetch("http://localhost:3000/sensores");
                if (!response.ok) throw new Error("Error al obtener sensores");

                sensoresData = await response.json();
                // Mostrar sólo sensores activos (los 'Inactivo' son soft-deleted)
                sensoresData = sensoresData.filter(s => s.estado === 'Activo');
                const tableBody = document.getElementById("sensores-table");
                tableBody.innerHTML = "";

                const actionsHeader = document.getElementById('actions-header');
                const hideActions = actionsHeader && actionsHeader.style.display === 'none';

                if (sensoresData.length === 0) {
                    // Número de columnas visibles cuando no hay filas
                    // columnas: Tipo, Nombre, Unidad, Tiempo, Descripción, Estado, Imagen, [Acciones?]
                    const baseCols = 7; // sin acciones
                    const colspan = hideActions ? baseCols : baseCols + 1;
                    tableBody.innerHTML = `<tr><td colspan="${colspan}">No hay sensores registrados</td></tr>`;
                } else {
                    sensoresData.forEach(s => {
                        const row = document.createElement("tr");
                        let actionsCell = '';
                        if (allowedToAct.includes(userRole)) {
                            actionsCell = `
                                <td>
                                    <button class="btn btn-warning btn-sm" onclick="editSensor(${s.idSensor})" title="Editar">
                                        <i class="material-icons">edit</i>
                                    </button>
                                    <button class="btn ${s.estado === 'Activo' ? 'btn-danger' : 'btn-success'} btn-sm"
                                        onclick="toggleSensorStatus(${s.idSensor}, '${s.estado}')"
                                        title="${s.estado === 'Activo' ? 'Desactivar' : 'Activar'}">
                                        <i class="material-icons">${s.estado === 'Activo' ? 'visibility_off' : 'visibility'}</i>
                                    </button>
                                    <button class="btn btn-danger btn-sm" onclick="confirmDeleteSensor(${s.idSensor}, '${s.nombreSensor.replace(/'/g, "\\'")}')" title="Eliminar">
                                        <i class="material-icons">delete</i>
                                    </button>
                                </td>`;
                        }

                        row.innerHTML = `
                        
                            <td>${s.tipoSensor}</td>
                            <td>${s.nombreSensor}</td>
                            <td>${s.unidadMedida}</td>
                            <td>${s.tiempoEscaneo}</td>
                            <td>${s.descripcion || 'Sin descripción'}</td>
                            <td>
                                <span class="status-badge ${s.estado === 'Activo' ? 'status-activo' : 'status-inactivo'}">
                                    ${s.estado}
                                </span>
                            </td>
                            <td>${s.image ? `<img src="http://localhost:3000/uploads/${s.image}" width="60" style="border-radius: 6px;">` : "Sin imagen"}</td>
                            ${actionsCell}`;
                        tableBody.appendChild(row);
                    });
                }
            } catch (error) {
                console.error("Error cargando sensores:", error);
                document.getElementById("sensores-table").innerHTML = `
                    <tr><td colspan="9" style="color: #dc3545;">Error al cargar los sensores. Por favor, intente nuevamente.</td></tr>`;
            } finally {
                loader.classList.remove("show");
                tableContainer.style.display = "table";
            }
        }

        function editSensor(id) {
            if (!allowedToAct.includes(userRole)) return alert('Acceso Denegado.');
            window.location.href = `../sensores/datos_sensor.html?id=${id}`;
        }

        async function toggleSensorStatus(id, currentStatus) {
            if (!allowedToAct.includes(userRole)) return alert('Acceso Denegado.');

            try {
                const newStatus = currentStatus === 'Activo' ? 'Inactivo' : 'Activo';
                await loadSensores();
                alert(`Sensor ${newStatus === 'Activo' ? 'activado' : 'desactivado'} correctamente`);
            } catch (error) {
                console.error('Error al cambiar estado:', error);
                alert('Error al cambiar el estado del sensor. Por favor, intente nuevamente.');
            }
        }

        // Confirmar y eliminar sensor
        function confirmDeleteSensor(id, nombre) {
            if (!allowedToAct.includes(userRole)) return alert('Acceso Denegado.');
            const confirmation = confirm(`¿Seguro que desea eliminar el sensor "${nombre}"? Esta acción no se puede deshacer.`);
            if (!confirmation) return;
            deleteSensor(id);
        }

        async function deleteSensor(id) {
            try {
                const token = sessionStorage.getItem('userToken');
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const response = await fetch(`http://localhost:3000/sensores/${id}`, {
                    method: 'DELETE',
                    headers
                });

                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.error || 'Error eliminando el sensor');
                }

                alert('Sensor eliminado correctamente');
                await loadSensores();
            } catch (error) {
                console.error('Error eliminando sensor:', error);
                alert('No se pudo eliminar el sensor. Por favor, intente nuevamente.');
            }
        }
    </script>
</body>
</html>
