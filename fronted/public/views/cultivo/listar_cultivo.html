<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listar Cultivos</title>
  <link rel="stylesheet" href="/fronted/public/css/components/listar.css">
  <script src="/fronted/public/views/components/header.js" defer></script>
</head>
<body>
  <!-- Barra GOV superior -->
  <div class="gov-top">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top">
  </div>
  <header class="header"></header>

  <main class="content-container">
    <h2 class="form__title">Cultivos Registrados</h2>

    <table class="styled-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Tipo</th>
          <th>Código</th>
          <th>Tamaño</th>
          <th>Ubicación</th>
          <th>Estado</th>
          <th>Imagen</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="cultivos-table"></tbody>
    </table>
  </main>
  <!-- Barra GOV inferior -->
  <div class="gov-bottom">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom">
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const response = await fetch("http://localhost:3000/cultivo");
        if (!response.ok) throw new Error("Error al obtener cultivos");

        const cultivos = await response.json();
        const tableBody = document.getElementById("cultivos-table");
        tableBody.innerHTML = "";

        if (cultivos.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="8">No hay cultivos registrados</td></tr>`;
          return;
        }

        cultivos.forEach(c => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${c.id}</td>
            <td>${c.cultivoName}</td>
            <td>${c.cultivoType}</td>
            <td>${c.cultivoID}</td>
            <td>${c.size}</td>
            <td>${c.location}</td>
            <td>${c.state}</td>
            <td>${c.image ? `<img src="/uploads/${c.image}" width="60">` : "Sin imagen"}</td>
            <td>
                <a href="../cultivo/datos_cultivo.html?id=${c.id}" class="edit-link">Editar</a>
            </td>
          `;
          tableBody.appendChild(row);
        });
      } catch (error) {
        console.error("❌ Error cargando cultivos:", error);
      }
    });
  </script>
</body>
</html>
