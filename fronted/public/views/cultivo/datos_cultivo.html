<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cultivo</title>
    <link rel="stylesheet" href="/fronted/public/css/main.css">
    <script src="/fronted/public/views/components/header.js"></script>
</head>
<body>
      <!-- Barra GOV superior -->
  <div class="gov-top">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top">
  </div>
    <header class="header"></header>
    <main class="form-container">
        <form class="form" id="edit-form">
            <h2 class="form__title">Editar Cultivo</h2>
            <input type="hidden" id="cultivoId">

            <div class="form__row">
                <div class="form__column">
                    <label class="form__label">Cargar imagen</label>
                    <input class="form__input form__input--imagen" type="file" name="image" id="image">
    
                    <label class="form__label">Tipo cultivo</label>
                    <input class="form__input cultivo__input--type" type="text" name="cultivoType" id="cultivoType">
    
                    <label class="form__label">Nombre Cultivo</label>
                    <input class="form__input cultivo__input--name" type="text" name="cultivoName" id="cultivoName">
    
                    <label class="form__label">Identificador cultivo</label>
                    <input class="form__input cultivo__input--ID" type="text" name="cultivoID" id="cultivoID">
                </div>
    
                <div class="form__column">
                    <label class="form__label">Tamaño</label>
                    <input class="form__input cultivo__input--size" type="text" name="size" id="size">
    
                    <label class="form__label">Ubicacion</label>
                    <input class="form__input cultivo__input--location" type="text" name="location" id="location">
    
                    <label class="form__label">Descripción</label>
                    <textarea class="form__input cultivo__input--description" name="description" id="description"></textarea>
    
                    <label class="form__label">Estado (activo / inactivo)</label>
                    <select name="state" class="form__input cultivo__input--state" id="state">
                        <option value="">Seleccione una opción</option>
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>
                </div>
            </div>
    
            <div class="form__btn-group">
                <button type="submit" class="form__btn form__btn--registrar" id="submitBtn">Actualizar</button>
                <a href="listar_cultivos.html" class="btn__secundary">Cancelar</a>
            </div>
        </form>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const cultivoId = urlParams.get('id');
            const form = document.getElementById('edit-form');

            if (!cultivoId) {
                console.error('No se encontró el ID del cultivo en la URL.');
                alert('Error: No se encontró el ID del cultivo.');
                return;
            }

            // Fetch existing data
            try {
                const response = await fetch(`http://localhost:3000/cultivo/${cultivoId}`);
                if (!response.ok) {
                    throw new Error('Error al obtener los datos del cultivo.');
                }
                const data = await response.json();
                
                // Populate form fields
                document.getElementById('cultivoId').value = data.id;
                document.getElementById('cultivoType').value = data.cultivoType;
                document.getElementById('cultivoName').value = data.cultivoName;
                document.getElementById('cultivoID').value = data.cultivoID;
                document.getElementById('size').value = data.size;
                document.getElementById('location').value = data.location;
                document.getElementById('description').value = data.description;
                document.getElementById('state').value = data.state;
            } catch (error) {
                console.error("❌ Error cargando datos:", error);
                alert(`Error al cargar los datos: ${error.message}`);
            }

            // Handle form submission
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const updatedData = {
                    id: document.getElementById('cultivoId').value,
                    cultivoType: document.getElementById('cultivoType').value,
                    cultivoName: document.getElementById('cultivoName').value,
                    cultivoID: document.getElementById('cultivoID').value,
                    size: document.getElementById('size').value,
                    location: document.getElementById('location').value,
                    description: document.getElementById('description').value,
                    state: document.getElementById('state').value
                };

                try {
                    const response = await fetch(`http://localhost:3000/cultivo/${cultivoId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedData)
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'Error al actualizar el cultivo.');
                    }
                    
                    alert('✅ Cultivo actualizado exitosamente.');
                    window.location.href = 'listar_cultivo.html';
                } catch (error) {
                    console.error("❌ Error al actualizar el cultivo:", error);
                    alert(`Error al actualizar: ${error.message}`);
                }
            });
        });
    </script>
</body>
</html>
<!-- Barra GOV inferior -->
    <div class="gov-bottom">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom">
    </div>
