<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listar Uso de Insumos</title>
  <link rel="stylesheet" href="/fronted/public/css/components/listar.css">
  <script src="/fronted/public/views/components/header.js" defer></script>
</head>
<body>
  <header class="header"></header>

  <main class="content-container">
    <h2 class="form__title">Uso de Insumos Registrados</h2>

    <table class="styled-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Insumo</th>
          <th>Fecha Uso</th>
          <th>Cantidad</th>
          <th>Responsable</th>
          <th>Valor Unitario</th>
          <th>Valor Total</th>
          <th>Observaciones</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="uso-table"></tbody>
    </table>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const response = await fetch("http://localhost:3000/uso_insumo");
        if (!response.ok) throw new Error("Error al obtener uso de insumos");

        const usos = await response.json();
        const tableBody = document.getElementById("uso-table");
        tableBody.innerHTML = "";

        if (usos.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="8">No hay registros de uso de insumos</td></tr>`;
          return;
        }

        usos.forEach(u => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${u.id}</td>
            <td>${u.insumo}</td>
            <td>${u.fecha_uso}</td>
            <td>${u.cantidad}</td>
            <td>${u.responsable}</td>
            <td>${u.valor_unitario}</td>
            <td>${u.valor_total}</td>
            <td>${u.observaciones || "-"}</td>
            <td>
                <a href="../insumos/ver_datos_uso_insumo.html?id=${u.id}" class="edit-link">Editar</a>
            </td>
          `;
          tableBody.appendChild(row);
        });
      } catch (error) {
        console.error("❌ Error cargando uso de insumos:", error);
      }
    });
  </script>
</body>
</html>
