<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listar Ciclos de Cultivo</title>
  <link rel="stylesheet" href="/fronted/public/css/components/listar.css">
  <script src="/fronted/public/views/components/header.js" defer></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="gov-top">
  <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top">
</div>

<header class="header">
  <img class="header__logo" src="/fronted/public/img/logo-de-Sena-sin-fondo-Blanco-300x300.png" alt="Logo SENA">
</header>

<main class="content-container">
  <h2 class="form__title">Ciclos de Cultivo Registrados</h2>

  <div class="action-buttons" id="management-actions">
    <a href="../ciclo_cultivo/crear_ciclo_cultivo.html" class="btn btn-primary">
      <i class="material-icons">add</i> Agregar Ciclo
    </a>
    <button class="btn btn-success" onclick="exportToPDF()"> <i class="material-icons">picture_as_pdf</i> Descargar PDF </button>
    <button class="btn btn-success" onclick="exportToExcel()"> <i class="material-icons">table_chart</i> Descargar Excel </button>
  </div>

  <div class="loader" id="loader"><div class="spinner"></div></div>

  <table class="styled-table" id="ciclos-table-container">
    <thead>
      <tr>
        <th>Código</th>
        <th>Nombre</th>
        <th>Fecha Inicio</th>
        <th>Fecha Fin</th>
        <th>Novedades</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th>Imagen</th>
        <th id="actions-header">Acciones</th>
      </tr>
    </thead>
    <tbody id="ciclos-table"></tbody>
  </table>
</main>

<footer class="footer">
  <p>© 2025 SENA - Todos los derechos reservados</p>
</footer>

<div class="gov-bottom">
  <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom">
</div>

<script>
(function() {
  const SERVER_BASE_URL = "http://localhost:3000";
  const UPLOADS_PATH = "/uploads/";
  const DEFAULT_IMAGE = '/fronted/public/img/default.png';
  const managementRoles = ['admin', 'superadmin'];
  let isManager = false;
  let ciclosData = [];

  // 1. Validar sesión y permisos
  const userData = sessionStorage.getItem('userData');
  const user = userData ? JSON.parse(userData) : null;
  if(!user) return window.location.href = '/fronted/public/views/usuarios/inicio_sesion.html';
  isManager = managementRoles.includes(user.role);

  // Ocultar acciones si no es admin
  document.addEventListener('DOMContentLoaded', () => {
    if(!isManager){
      document.getElementById('management-actions').style.display='none';
      document.getElementById('actions-header').classList.add('hidden-action');
    }
    loadCiclos();
  });

  // 2. Cargar ciclos
  async function loadCiclos(){
    const loader = document.getElementById("loader");
    const tableContainer = document.getElementById("ciclos-table-container");
    const totalColumns = isManager ? 10 : 9;
    loader.classList.add("show"); tableContainer.style.display="none";

    try {
      const res = await fetch(`${SERVER_BASE_URL}/ciclocultivo`);
      if(!res.ok) throw new Error("Error al obtener ciclos");
      ciclosData = await res.json();
      const tbody = document.getElementById("ciclos-table");
      tbody.innerHTML = ciclosData.length===0
        ? `<tr><td colspan="${totalColumns}">No hay ciclos registrados</td></tr>`
        : '';

      ciclosData.forEach(c=>{
        const imgCell = c.image ? `<img src="${SERVER_BASE_URL}${UPLOADS_PATH}${c.image}" class="table-img" onerror="this.onerror=null;this.src='${DEFAULT_IMAGE}'">` : 'Sin imagen';
        const actionCell = isManager ? `
          <td>
            <button class="btn btn-warning btn-sm" onclick="editCiclo(${c.id})" title="Editar"><i class="material-icons">edit</i></button>
            <button class="btn ${c.state==='activo'?'btn-danger':'btn-success'} btn-sm" onclick="toggleCicloState(${c.id},'${c.state}')" title="${c.state==='activo'?'Desactivar':'Activar'}">
              <i class="material-icons">${c.state==='activo'?'visibility_off':'visibility'}</i>
            </button>
          </td>` : '';
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${c.cicloID}</td>
          <td>${c.cicloName}</td>
          <td>${c.siembraDate}</td>
          <td>${c.cosechaDate}</td>
          <td>${c.news}</td>
          <td>${c.description}</td>
          <td><span class="status-badge ${c.state==='activo'?'status-activo':'status-inactivo'}">${c.state}</span></td>
          <td>${imgCell}</td>
          ${actionCell}
        `;
        tbody.appendChild(row);
      });
    } catch(e){
      console.error(e);
      document.getElementById("ciclos-table").innerHTML = `<tr><td colspan="${totalColumns}" style="color:#dc3545;">Error cargando ciclos. Revise la consola.</td></tr>`;
    } finally{
      loader.classList.remove("show"); tableContainer.style.display="table";
    }
  }

  // 3. Funciones de gestión
  window.editCiclo = function(id){ if(!isManager) return alert('Acceso Denegado'); window.location.href=`../ciclo_cultivo/datos_ciclo_cultivo.html?id=${id}`; }
  window.toggleCicloState = async function(id,current){
    if(!isManager) return alert('Acceso Denegado');
    try{
      const ciclo = ciclosData.find(x=>x.id===id);
      const newState = current==='activo'?'inactivo':'activo';
      const body = {...ciclo, state:newState};
      const res = await fetch(`${SERVER_BASE_URL}/ciclocultivo/${id}`, {
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      if(!res.ok) throw new Error();
      await loadCiclos();
      alert(`Ciclo ${newState==='activo'?'activado':'desactivado'} correctamente`);
    } catch{ alert('Error al cambiar estado'); }
  }

  // 4. Exportaciones
  window.exportToPDF = function(){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(18); doc.text('Ciclos de Cultivo',14,20);
    doc.setFontSize(11); doc.text(`Fecha: ${new Date().toLocaleDateString()}`,14,28);
    const rows = ciclosData.map(c=>[c.id,c.cicloID,c.cicloName,c.siembraDate,c.cosechaDate,c.news,c.description,c.state,c.image?'Sí':'No']);
    doc.autoTable({head:[['ID','Código','Nombre','Siembra','Cosecha','Novedades','Descripción','Estado','Imagen']], body:rows, startY:35, theme:'grid', headStyles:{fillColor:[57,169,0]}, styles:{fontSize:9}});
    doc.save('ciclos_cultivo.pdf');
  }
  window.exportToExcel = function(){
    const data = ciclosData.map(c=>({
      ID:c.id, Código:c.cicloID, Nombre:c.cicloName, FechaSiembra:c.siembraDate,
      FechaCosecha:c.cosechaDate, Novedades:c.news, Descripción:c.description,
      Estado:c.state, Imagen:c.image?`${SERVER_BASE_URL}${UPLOADS_PATH}${c.image}`:'N/A'
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'CiclosCultivo');
    XLSX.writeFile(wb,'ciclos_cultivo.xlsx');
  }
})();
</script>
</body>
</html>
