<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Insumos</title>
    <link rel="stylesheet" href="/fronted/public/css/pages/homes/stylieshome-insumos-sensores.css" />
    <script src="/fronted/public/views/components/grid.js"></script>
    
</head>

<body> <!-- Banner superior -->
    <div class="header-banner"> <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top" class="header-banner__img">
    </div> <!-- Header -->
    <header class="header"> <img src="/fronted/public/img/logo-de-Sena-sin-fondo-Blanco-300x300.png" alt="Logo SENA"
            class="header__logo">
        <nav class="header__nav"> <a href="index.html" class="header__link">Inicio</a> <a href="home-cultivo-3.html"
                class="header__link">Cultivos</a> <a href="home-sensores.html" class="header__link">Sensores</a> <a
                id="btnLogout" class="header__link" style="cursor:pointer">Cerrar Sesión</a> </nav>
    </header>
    <main class="background"> <!-- Cajas superiores -->
        <div class="top-boxes">
            <div class="top-boxes__item"><a href="../insumos/crear_inusomo.html">Crear insumo</a></div>
            <div class="top-boxes__item"><a href="../insumos/visualizar_insumo.html">Visualizar insumo</a></div>
            <div class="top-boxes__item"><a href="../insumos/listar_insumo.html">Listar insumo</a></div>
        </div> <!-- Contenedor de cuadros -->
        <div class="grid"></div>
    </main> <!-- Banner inferior -->
    <div class="footer-banner"> <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom"
            class="footer-banner__img"> </div>
    <script> (function () { const user = JSON.parse(localStorage.getItem('lembo_user_data') || 'null'); if (!user) { window.location.href = '/fronted/public/views/usuarios/inicio_sesion.html'; return; } const role = user.role; const rules = { visitante: ['Sensores','Cultivos','Visualizar insumo'], personal: ['Sensores'], admin: ['Inicio', 'Cultivos', 'Sensores', 'Crear insumo', 'Visualizar insumo', 'Listar insumo'], superadmin: [] }; document.querySelectorAll('.header__link').forEach(link => { const txt = link.textContent.trim(); if (txt === 'Cerrar Sesión') return; if (!rules[role] || !rules[role].includes(txt)) link.remove(); }); document.querySelectorAll('.top-boxes__item a').forEach(a => { const txt = a.textContent.trim(); if (!rules[role] || !rules[role].includes(txt)) a.parentElement.remove(); }); document.getElementById('btnLogout').onclick = function () { localStorage.removeItem('lembo_user_data'); window.location.href = '/fronted/public/views/usuarios/inicio_sesion.html'; }; })(); </script>
</body>

</html>
