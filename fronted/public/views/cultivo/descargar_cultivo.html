<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación</title>
    <link rel="stylesheet" href="/fronted/public/css/pages/cultivo/style_confirmacion.css">
</head>
<body>
    <!-- Barra GOV superior -->
    <div class="gov-top">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Colombia">
    </div>

    <!-- Header verde SENA -->
    <header class="header">
        <img class="header__logo" src="/fronted/public/img/logo-de-Sena-sin-fondo-Blanco-300x300.png" alt="Logo SENA">
    </header>

    <!-- Contenedor principal centrado -->
    <main class="confirmation">
        <div class="confirmation__content">
            <h1 class="confirmation__title">Descarga Exitosa</h1>
            <button class="confirmation__button">
                <a href="#" class="confirmation__link">Volver</a>
            </button>
        </div>
    </main>

    <!-- Barra GOV inferior -->
    <div class="gov-bottom">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Colombia">
    </div>
</body>
</html>
