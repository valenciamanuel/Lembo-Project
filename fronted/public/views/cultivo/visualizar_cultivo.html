<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizar Cultivos</title>
  <link rel="stylesheet" href="/css/components/visualizar.css">
  <script src="/fronted/public/views/components/header.js" defer></script>
  <link rel="stylesheet" href="/fronted/public/css/components/visualizar.css">
</head>
<body>
  <!-- <div class="gov-top">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top">
  </div> -->

  <header class="header"></header>

  <main class="content-container">
    <h2 class="form__title">Cultivos Registrados</h2>

    <div id="cultivos-container" class="cards-container">
      <!-- Aquí JS insertará cada card -->
    </div>
  </main>
  <!-- Barra GOV inferior -->
  <!-- <div class="gov-bottom">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom">
  </div> -->

  <!-- ✅ JS embebido -->
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        // ⚠️ Verifica si en tu server.js usaste /cultivo o /cultivos
        const response = await fetch("http://localhost:3000/cultivo");
        if (!response.ok) throw new Error("Error al obtener cultivos");

        const cultivos = await response.json();
        const container = document.getElementById("cultivos-container");
        container.innerHTML = "";

        if (cultivos.length === 0) {
          container.innerHTML = `<p class="no-cultivos">No hay cultivos registrados</p>`;
          return;
        }

        cultivos.forEach(c => {
          const card = document.createElement("div");
          card.classList.add("card");

          card.innerHTML = `
            <div class="card-image">
              ${c.image ? `<img src="http://localhost:3000/uploads/${c.image}" alt="${c.cultivoName}">` : `<div class="no-image">Sin imagen</div>`}
            </div>
            <div class="card-content">
              <h3>${c.cultivoName}</h3>
              <p><strong>Tipo:</strong> ${c.cultivoType}</p>
              <p><strong>Código:</strong> ${c.cultivoID}</p>
              <p><strong>Tamaño:</strong> ${c.size || "-"}</p>
              <p><strong>Ubicación:</strong> ${c.location || "-"}</p>
              <p><strong>Estado:</strong> <span class="estado ${c.state.toLowerCase()}">${c.state}</span></p>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (error) {
        console.error("❌ Error cargando cultivos:", error);

        const container = document.getElementById("cultivos-container");
        container.innerHTML = `<p class="no-cultivos">Error al cargar cultivos</p>`;
      }
    });
  </script>
</body>
</html>
