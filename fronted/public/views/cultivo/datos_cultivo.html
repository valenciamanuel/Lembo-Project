<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cultivo</title>
    <link rel="stylesheet" href="/fronted/public/css/main.css">
    <link rel="stylesheet" href="/fronted/public/css/pages/crear.css">
    <script src="/fronted/public/views/components/header.js" defer></script>
</head>
<body>
    <div class="gov-top">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top">
    </div>
    <header class="header" style="top: 5rem;"></header>

    <main class="form-container">
        <form class="form" id="edit-form" enctype="multipart/form-data" novalidate>
            <h2 class="form__title">Editar Cultivo</h2>
            <div id="mensajeValidacion" class="form__message"></div>
            <input type="hidden" id="cultivoId">

            <div class="form__row">
                <div class="form__column">
                    <label class="form__label" for="image">Imagen</label>
                    <input class="form__input" type="file" name="image" id="image" accept="image/*">

                    <label class="form__label" for="cultivoType">Tipo cultivo</label>
                    <select class="form__input" name="cultivoType" id="cultivoType" required>
                        <option value="">Seleccione un tipo de cultivo</option>
                        <option value="cereal">Cereal</option>
                        <option value="hortaliza">Hortaliza</option>
                        <option value="frutal">Frutal</option>
                        <option value="leguminosa">Leguminosa</option>
                        <option value="oleaginosa">Oleaginosa</option>
                        <option value="tuberculo">Tubérculo</option>
                        <option value="forrajero">Forrajero</option>
                        <option value="industrial">Industrial</option>
                        <option value="medicinal">Medicinal/Aromática</option>
                    </select>

                    <label class="form__label" for="cultivoName">Nombre Cultivo</label>
                    <input class="form__input" type="text" id="cultivoName" name="cultivoName" required>

                    <label class="form__label" for="cultivoID">Identificador cultivo</label>
                    <input class="form__input" type="text" id="cultivoID" name="cultivoID" required>
                </div>
                <div class="form__column">
                    <label class="form__label" for="size">Tamaño</label>
                    <input class="form__input" type="text" id="size" name="size" required>

                    <label class="form__label" for="location">Ubicación</label>
                    <input class="form__input" type="text" id="location" name="location" required>

                    <label class="form__label" for="description">Descripción</label>
                    <input class="form__input" type="text" id="description" name="description" required>

                    <label class="form__label" for="state">Estado</label>
                    <select class="form__input" id="state" name="state" required>
                        <option value="">Seleccione</option>
                        <option value="activo">Activo</option>
                        <option value="inactivo">Inactivo</option>
                    </select>
                </div>
            </div>

            <div class="form__btn-group">
                <button type="submit" class="form__btn form__btn--registrar">Actualizar</button>
                <a href="listar_cultivo.html" class="btn__secundary">Cancelar</a>
            </div>
        </form>
    </main>

    <div class="gov-bottom">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom">
    </div>

    <script>
        const showError = msg => {
            const el = document.getElementById('mensajeValidacion');
            el.textContent = msg;
            el.classList.add('error');
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const cultivoId = params.get('id');
            
            if (!cultivoId) { 
                showError('Error: ID de cultivo no proporcionado.');
                return; 
            }

            const form = document.getElementById('edit-form');
            const fields = ['cultivoType', 'cultivoName', 'cultivoID', 'size', 'location', 'description', 'state'];
            let currentImage = '';
            
            try {
                const res = await fetch(`http://localhost:3000/cultivo/${cultivoId}`);
                if (!res.ok) throw new Error('Error al cargar datos');
                const data = await res.json();
                
                document.getElementById('cultivoId').value = data.id;
                currentImage = data.image || ''; 
                
                fields.forEach(f => {
                    const element = document.getElementById(f);
                    if (element) {
                        element.value = data[f] || '';
                    }
                });
            } catch (error) {
                console.error(error);
                showError('Error al cargar datos del cultivo');
                return;
            }

            form.addEventListener('submit', async e => {
                e.preventDefault();
                document.getElementById('mensajeValidacion').textContent = '';

                const vals = {};
                for (const f of fields) {
                    vals[f] = document.getElementById(f).value.trim();
                    if (!vals[f] || (f === 'cultivoType' && vals[f] === '')) { 
                        showError('Todos los campos obligatorios deben llenarse'); 
                        return; 
                    }
                }
                
                if (vals.cultivoType.length < 3) { 
                    showError('Tipo de cultivo mínimo 3 caracteres'); 
                    return; 
                }
                if (vals.cultivoName.length < 3) { 
                    showError('Nombre de cultivo mínimo 3 caracteres'); 
                    return; 
                }
                if (!/^[A-Za-z0-9_-]+$/.test(vals.cultivoID)) {
                    showError('Identificador solo puede contener letras, números, guiones o _'); 
                    return;
                }
                if (vals.cultivoID.length < 3) { 
                    showError('ID cultivo mínimo 3 caracteres'); 
                    return; 
                }
                if (vals.size.length < 1) { 
                    showError('Tamaño no puede estar vacío'); 
                    return; 
                }
                if (vals.location.length < 3) { 
                    showError('Ubicación mínimo 3 caracteres'); 
                    return; 
                }
                if (vals.description.length < 5) { 
                    showError('Descripción mínimo 5 caracteres'); 
                    return; 
                }

                const formData = new FormData();
                formData.append('cultivoType', vals.cultivoType);
                formData.append('cultivoName', vals.cultivoName);
                formData.append('cultivoID', vals.cultivoID);
                formData.append('size', vals.size);
                formData.append('location', vals.location);
                formData.append('description', vals.description);
                formData.append('state', vals.state);
                
                const fileInput = document.getElementById('image');
                const newFile = fileInput.files[0];
                
                if (newFile) {
                    formData.append('image', newFile);
                }

                try {
                    const response = await fetch(`http://localhost:3000/cultivo/${cultivoId}`, {
                        method: 'PUT',
                        body: formData
                    });
                    
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'Error al actualizar cultivo');
                    }
                    
                    // Mostrar alerta al usuario
                    alert('¡Cultivo actualizado exitosamente!');

                    const messageEl = document.getElementById('mensajeValidacion');
                    messageEl.textContent = 'Cultivo actualizado exitosamente';
                    messageEl.classList.remove('error');
                    messageEl.classList.add('success');
                    
                    setTimeout(() => {
                        window.location.href = 'listar_cultivo.html';
                    }, 1000);
                    
                } catch (error) {
                    console.error('Error:', error);
                    showError(error.message);
                }
            });
        });
    </script>
</body>
</html>
