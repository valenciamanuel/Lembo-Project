<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Principal</title>
    <link rel="stylesheet" href="/fronted/public/css/pages/homes/stylieshome-insumos-sensores.css">
    <script src="/fronted/public/views/components/grid.js"></script>
</head>
<body>
    <!-- Encabezado -->
    <header class="header">
        <img src="/fronted/public/img/logo-de-Sena-sin-fondo-Blanco-300x300.png" alt="Logo SENA" class="header__logo">
        <nav class="header__nav">
            <a href="../usuarios/registrar.html" class="header__link">Registrar usuario</a>
            <a href="../usuarios/listar.html" class="header__link">Listar usuarios</a>
            <a href="../homes/home-ciclo.html" class="header__link">Ciclo Cultivo</a>
            <a href="../vizualisar/html/asocciaciones.html" class="header__link">Asociación</a>
            <a id="btnLogout" class="header__link" style="cursor: pointer;">Cerrar Sesión</a>
        </nav>
    </header>

    <!-- Imagen superior -->
    <div class="header-banner">
      <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top" class="header-banner__img">
    </div>

    <!-- Imagen de fondo -->
    <div class="background">
        <!-- Botones superiores -->
        <div class="top-boxes">
            <div class="top-boxes__item">
                <p><a href="../homes/home-sensores.html">Sensores</a></p>
            </div>
            <div class="top-boxes__item">
                <p><a href="../homes/home-insumos.html">Insumos</a></p>
            </div>
            <div class="top-boxes__item">
                <p><a href="../homes/home-cultivo-3.html">Cultivos</a></p>
            </div>
        </div>

        <!-- Contenedor de cuadros -->
        <div class="grid"></div>
    </div>

    <!-- Imagen inferior -->
    <div class="footer-banner">
      <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom" class="footer-banner__img">
    </div>

    <script>
    (function(){
      const user = JSON.parse(localStorage.getItem('lembo_user_data')||'null');
      if (!user) {
        window.location.href = '/fronted/public/views/usuarios/inicio_sesion.html';
        return;
      }
      const role = user.role;
      const rules = {
        visitante: ['Ciclo Cultivo','Sensores','Insumos'],
        personal: ['Sensores'],
        admin: ['Listar usuarios','Ciclo Cultivo','Asociación','Sensores','Insumos','Cultivos'],
        superadmin: ['Registrar usuario','Listar usuarios']
      };
      document.querySelectorAll('.header__link').forEach(link => {
        const txt = link.textContent.trim();
        if (txt==='Cerrar Sesión') return;
        if (!rules[role] || !rules[role].includes(txt)) link.remove();
      });
      document.querySelectorAll('.top-boxes__item a').forEach(a=>{
        const txt=a.textContent.trim();
        if (!rules[role]||!rules[role].includes(txt)) a.parentElement.remove();
      });
      document.getElementById('btnLogout').onclick = function(){
        localStorage.removeItem('lembo_user_data');
        window.location.href = '/fronted/public/views/usuarios/inicio_sesion.html';
      };
    })();
    </script>
</body>
</html>
