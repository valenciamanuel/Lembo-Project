<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Cultivo</title>
    <link rel="stylesheet" href="/fronted/public/css/pages/cultivo/style_deshabilitar_cultivo.css">
</head>
<body>

    <!-- GOV superior -->
    <div class="gov-top">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Colombia">
    </div>

    <!-- Header verde -->
    <header class="header">
        <img class="header__logo" src="/fronted/public/img/logo-de-Sena-sin-fondo-Blanco-300x300.png" alt="Logo SENA">
    </header>

    <!-- Contenedor central -->
    <main class="cultivo">
        <div class="cultivo__contenedor">
            
            <!-- Imagen decorativa -->
            <div class="cultivo__imagen"></div>

            <!-- Formulario -->
            <div class="cultivo__formulario">
                <h1 class="cultivo__titulo">ID Cultivo</h1>
                <label class="cultivo__label" for="idCultivo">Ingrese ID:</label>
                <input class="cultivo__input" type="text" id="idCultivo" placeholder="Ej: 12345">
                <div id="mensaje" class="mensaje"></div>
                <button id="enviarBtn" class="boton boton--primario">Enviar</button>
            </div>

        </div>
    </main>

    <!-- GOV inferior -->
    <div class="gov-bottom">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Colombia">
    </div>

    <script src="/fronted/public/js/cultivos/validacion_deshabilitar.js"></script>
</body>
</html>
