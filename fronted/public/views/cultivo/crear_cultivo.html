<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datos Cultivo</title>
  <link rel="stylesheet" href="/fronted/public/css/main.css">
  <link rel="stylesheet" href="/fronted/public/css/pages/crear.css">
  <script src="/fronted/public/views/components/header.js" defer></script>
</head>
<body>
  <div class="page__banner--top">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top" class="page__banner__img">
  </div>
  <header class="header"></header>
  <main class="form-container">
    <form class="form" id="crear-cultivo-form" enctype="multipart/form-data" novalidate>
      <h2 class="form__title">Datos Cultivo</h2>
      <div id="mensajeValidacion" class="form__message"></div>
      <div class="form__row">
        <div class="form__column">
          <label class="form__label" for="image">Cargar imagen</label>
          <input class="form__input cultivo__input--imagen" type="file" name="image" id="image" accept="image/*">
          
          <label class="form__label" for="cultivoType">Tipo cultivo</label>
          <select class="form__input cultivo__input--type" name="cultivoType" id="cultivoType" required>
            <option value="">Seleccione un tipo</option>
            <option value="Granos">Granos (maíz, arroz, trigo, cebada)</option>
            <option value="Hortalizas">Hortalizas (tomate, cebolla, zanahoria, lechuga)</option>
            <option value="Frutales">Frutales (mango, papaya, banano, naranja)</option>
            <option value="Tubérculos">Tubérculos (papa, yuca, batata)</option>
            <option value="Leguminosas">Leguminosas (frijol, lenteja, garbanzo)</option>
            <option value="Forrajes">Forrajes (pasto, alfalfa)</option>
            <option value="Aromáticas">Plantas aromáticas (menta, albahaca, orégano)</option>
            <option value="Medicinales">Plantas medicinales (manzanilla, sábila)</option>
          </select>

          <label class="form__label" for="cultivoName">Nombre Cultivo</label>
          <input class="form__input cultivo__input--name" type="text" name="cultivoName" id="cultivoName" required>
          <label class="form__label" for="cultivoID">Identificador cultivo</label>
          <input class="form__input cultivo__input--ID" type="text" name="cultivoID" id="cultivoID" required>
        </div>
        <div class="form__column">
          <label class="form__label" for="size">Tamaño</label>
          <input class="form__input cultivo__input--size" type="text" name="size" id="size" required>
          <label class="form__label" for="location">Ubicación</label>
          <input class="form__input cultivo__input--location" type="text" name="location" id="location" required>
          <label class="form__label" for="description">Descripción</label>
          <input class="form__input cultivo__input--description" type="text" name="description" id="description" required>
          <label class="form__label" for="state">Estado</label>
          <select name="state" class="form__input cultivo__input--state" id="state" required>
            <option value="">Seleccione una opción</option>
            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
          </select>
        </div>
      </div>
      <div class="form__btn-group">
        <button type="submit" class="form__btn form__btn--registrar">Crear</button>
        <a href="../homes/home-cultivo-3.html" class="btn__secundary">Cancelar</a>
      </div>
    </form>
  </main>
  <div class="page__banner--bottom">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom" class="page__banner__img">
  </div>

  <script>
    const showError = text => {
      const msg = document.getElementById('mensajeValidacion');
      msg.textContent = text;
      msg.classList.add('error');
    };

    document.getElementById('crear-cultivo-form').addEventListener('submit', async e => {
      e.preventDefault();
      document.getElementById('mensajeValidacion').textContent = '';

      const tipo = document.getElementById('cultivoType').value.trim();
      const nombre = document.getElementById('cultivoName').value.trim();
      const id = document.getElementById('cultivoID').value.trim();
      const size = document.getElementById('size').value.trim();
      const loc = document.getElementById('location').value.trim();
      const desc = document.getElementById('description').value.trim();
      const state = document.getElementById('state').value;
      const fileInput = document.getElementById('image');

      if (!tipo || !nombre || !id || !size || !loc || !desc || !state) {
        showError('Todos los campos son obligatorios');
        return;
      }
      
      // --- VALIDACIONES DE LONGITUD PARA CAMPOS DE TEXTO ---
      if (tipo.length < 3) {
        showError('El tipo de cultivo debe tener al menos 3 caracteres');
        return;
      }
      if (nombre.length < 3) {
        showError('El nombre del cultivo debe tener al menos 3 caracteres');
        return;
      }
      if (loc.length < 3) {
        showError('La ubicación debe tener al menos 3 caracteres');
        return;
      }
      if (desc.length < 5) {
        showError('La descripción debe tener al menos 5 caracteres');
        return;
      }
      
      // --- VALIDACIONES NUMÉRICAS Y DE FORMATO PARA ID Y TAMAÑO ---
      const numericId = Number(id);
      
      if (isNaN(numericId) || !Number.isInteger(numericId) || numericId <= 0) {
        showError('El Identificador de cultivo (ID) debe ser un número entero positivo.');
        return;
      }
      
      const numericSize = Number(size);
      if (isNaN(numericSize) || numericSize <= 0) {
        showError('El tamaño debe ser un número positivo (mayor a 0).');
        return;
      }
      
      if (!/^[A-Za-z0-9_-]+$/.test(id)) {
         showError('El identificador solo puede contener letras, números, guiones o guion bajo');
         return;
      }

      // Construir FormData
      const formData = new FormData();
      formData.append('cultivoType', tipo);
      formData.append('cultivoName', nombre);
      // Enviamos los valores numéricos ya validados al backend
      formData.append('cultivoID', numericId); 
      formData.append('size', numericSize); 
      formData.append('location', loc);
      formData.append('description', desc);
      formData.append('state', state);
      if (fileInput.files[0]) {
        formData.append('image', fileInput.files[0]);
      }

      try {
        const res = await fetch('http://localhost:3000/cultivo', {
          method: 'POST',
          body: formData
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Error al crear cultivo');
        }
        // No usar 'alert()', usar un mensaje en el contenedor
        document.getElementById('mensajeValidacion').textContent = ' Cultivo creado exitosamente.';
        document.getElementById('mensajeValidacion').classList.remove('error');
        // Redirigir o limpiar el formulario
        setTimeout(() => window.location.href = 'listar_cultivo.html', 1500); 

      } catch (error) {
        showError(error.message);
      }
    });
  </script>
</body>
</html>
