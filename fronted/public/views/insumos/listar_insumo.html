<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listar Insumos</title>
  <link rel="stylesheet" href="/fronted/public/css/components/listar.css">
  <script src="/fronted/public/views/components/header.js" defer></script>
</head>
<body>
  <div class="gov-top">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top">
  </div>
  <header class="header"></header>

  <main class="content-container">
    <h2 class="form__title">Insumos Registrados</h2>

    <table class="styled-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Cantidad</th>
          <th>Imagen</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="insumos-table"></tbody>
    </table>
  </main>
  <div class="gov-bottom">
    <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom">
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const response = await fetch("http://localhost:3000/insumo");
        if (!response.ok) throw new Error("Error al obtener insumos");

        const insumos = await response.json();
        const tableBody = document.getElementById("insumos-table");
        tableBody.innerHTML = "";

        if (insumos.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="5">No hay insumos registrados</td></tr>`;
          return;
        }

        insumos.forEach(i => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${i.idInsumo}</td>
            <td>${i.nombreInsumo}</td>
            <td>${i.descripcion}</td>
            <td>${i.cantidad}</td>
            <td>${i.image ? `<img src="/uploads/${i.image}" width="60">` : "Sin imagen"}</td>
            <td>
                <a href="../insumos/datos_inusomo.html?id=${i.i}" class="edit-link">Editar</a>
            </td>
          `;
          tableBody.appendChild(row);
        });
      } catch (error) {
        console.error("❌ Error cargando insumos:", error);
      }
    });
  </script>
</body>
</html>
