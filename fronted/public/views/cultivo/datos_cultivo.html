<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cultivo</title>
    <link rel="stylesheet" href="/fronted/public/css/main.css">
    <link rel="stylesheet" href="/fronted/public/css/pages/crear.css">
    <script src="/fronted/public/views/components/header.js" defer></script>
</head>

<body>
    <script>
        (function () {
            const userDataString = sessionStorage.getItem('userData');
            const user = userDataString ? JSON.parse(userDataString) : null;

            if (!user) {
                window.location.href = '/fronted/public/views/usuarios/inicio_sesion.html';
                return;
            }

            const allowedRoles = ['admin', 'superadmin'];
            if (!allowedRoles.includes(user.role)) {
                alert('Acceso Denegado: Su rol no tiene permiso para editar los datos de los cultivos.');
                window.location.href = '/fronted/public/views/cultivos/listar_cultivo.html';
                return;
            }

            // Lógica para cerrar sesión (si el header.js lo inyecta)
            const btnLogout = document.getElementById('btnLogout');
            if (btnLogout) {
                btnLogout.onclick = function () {
                    sessionStorage.removeItem('userData');
                    sessionStorage.removeItem('userToken');
                    localStorage.removeItem('lembo_user_data');
                    window.location.href = '/fronted/public/views/usuarios/inicio_sesion.html';
                };
            }
        })();
    </script>

    <div class="gov-top">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Top">
    </div>

    <header class="header" style="top: 5rem;"></header>

    <main class="form-container">
        <form class="form" id="edit-form" enctype="multipart/form-data" novalidate>
            <h2 class="form__title">Editar Cultivo</h2>
            <div id="mensajeValidacion" class="form__message"></div>
            <input type="hidden" id="cultivoId">
            <input type="hidden" id="existingImageName">

            <div class="form__row">
                <div class="form__column">
                    <label class="form__label" for="image">Imagen (Solo selecciona si deseas cambiarla)</label>
                    <input class="form__input" type="file" name="image" id="image" accept="image/*">
                    <div id="current-image-preview" style="margin-top: 5px;"></div>

                    <label class="form__label" for="cultivoType">Tipo cultivo</label>
                    <select class="form__input" name="cultivoType" id="cultivoType" required>
                        <option value="">Seleccione un tipo de cultivo</option>
                        <option value="cereal">Cereal</option>
                        <option value="hortaliza">Hortaliza</option>
                        <option value="frutal">Frutal</option>
                        <option value="leguminosa">Leguminosa</option>
                        <option value="oleaginosa">Oleaginosa</option>
                        <option value="tuberculo">Tubérculo</option>
                        <option value="forrajero">Forrajero</option>
                        <option value="industrial">Industrial</option>
                        <option value="medicinal">Medicinal/Aromática</option>
                    </select>

                    <label class="form__label" for="cultivoName">Nombre Cultivo</label>
                    <input class="form__input" type="text" id="cultivoName" name="cultivoName" required>

                    <label class="form__label" for="cultivoID">Identificador cultivo</label>
                    <input class="form__input" type="text" id="cultivoID" name="cultivoID" required>
                </div>

                <div class="form__column">
                    <label class="form__label" for="size">Tamaño (m²)</label>
                    <input class="form__input" type="text" id="size" name="size" required>

                    <label class="form__label" for="location">Ubicación</label>
                    <input class="form__input" type="text" id="location" name="location" required>

                    <label class="form__label" for="description">Descripción</label>
                    <input class="form__input" type="text" id="description" name="description" required>

                    <label class="form__label" for="state">Estado</label>
                    <select class="form__input" id="state" name="state" required>
                        <option value="">Seleccione</option>
                        <option value="activo">Activo</option>
                        <option value="inactivo">Inactivo</option>
                    </select>
                </div>
            </div>

            <div class="form__btn-group">
                <button type="submit" class="form__btn form__btn--registrar">Actualizar</button>
                <a href="listar_cultivo.html" class="btn__secundary">Cancelar</a>
            </div>
        </form>
    </main>

    <div class="gov-bottom">
        <img src="/fronted/public/img/GOVPRICIPAL.jpg" alt="GOV Bottom">
    </div>

    <script>
        const showMessage = (msg, type) => {
            const el = document.getElementById('mensajeValidacion');
            el.textContent = msg;
            el.className = `form__message ${type}`;
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                showMessage('Error: ID de cultivo no proporcionado.', 'error');
                return;
            }

            const form = document.getElementById('edit-form');
            const fileInput = document.getElementById('image');
            const previewContainer = document.getElementById('current-image-preview');
            const existingImageNameInput = document.getElementById('existingImageName');
            
            const fields = ['cultivoType', 'cultivoName', 'cultivoID', 'size', 'location', 'description', 'state'];

            // CARGAR DATOS EXISTENTES
            try {
                const res = await fetch(`http://localhost:3000/cultivo/${id}`);
                if (!res.ok) throw new Error('Error al cargar datos del cultivo');
                const data = await res.json();

                document.getElementById('cultivoId').value = data.id;
                
                // Carga del nombre de la imagen y previsualización
                existingImageNameInput.value = data.image || ''; // Guardamos el nombre actual
                if (data.image) {
                    previewContainer.innerHTML = `<img src="/uploads/${data.image}" width="80" style="border-radius:6px; border: 1px solid #ccc;">
                                                  <p style="font-size: 0.8em; margin-top: 5px;">Imagen actual</p>`;
                }


                fields.forEach(f => {
                    const element = document.getElementById(f);
                    if (element) {
                        element.value = data[f] || '';
                    }
                });
            } catch (error) {
                console.error(error);
                showMessage('No se pudieron cargar los datos del cultivo.', 'error');
                return;
            }

            // MANEJO DEL SUBMIT (ACTUALIZACIÓN)
            form.addEventListener('submit', async e => {
                e.preventDefault();
                showMessage('', '');

                const formData = new FormData();

                for (const f of fields) {
                    const val = document.getElementById(f).value.trim();
                    
                    // Validaciones
                    if (!val || (f === 'cultivoType' && val === '') || (f === 'state' && val === '')) {
                        showMessage('Todos los campos obligatorios deben llenarse.', 'error');
                        return;
                    }
                    if (f === 'cultivoName' && val.length < 3) {
                        showMessage('El nombre del cultivo debe tener al menos 3 caracteres.', 'error');
                        return;
                    }
                    if (f === 'cultivoID' && (!/^[A-Za-z0-9_-]+$/.test(val) || val.length < 3)) {
                        showMessage('Identificador de cultivo inválido (min. 3 caracteres, solo letras, números, guiones o _).', 'error');
                        return;
                    }
                    if (f === 'description' && val.length < 5) {
                        showMessage('La descripción debe tener al menos 5 caracteres.', 'error');
                        return;
                    }

                    formData.append(f, val);
                }

                const newFile = fileInput.files[0];

                // LÓGICA CLAVE PARA MANEJAR LA IMAGEN
                if (newFile) {
                    // 1. Si el usuario selecciona un nuevo archivo
                    formData.append('image', newFile);
                } else if (existingImageNameInput.value) {
                    // 2. Si NO selecciona un archivo nuevo pero EXISTE uno anterior, enviamos el nombre para que se conserve
                    formData.append('image', existingImageNameInput.value);
                }
                // Nota: Si no había imagen y no se selecciona una, el campo 'image' no se adjunta al FormData, y el backend debería mantener el valor nulo.


                // PETICIÓN PUT
                try {
                    const response = await fetch(`http://localhost:3000/cultivo/${id}`, {
                        method: 'PUT',
                        body: formData
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({ error: 'Error desconocido del servidor.' }));
                        throw new Error(errorData.error || 'Error al actualizar el cultivo.');
                    }

                    showMessage('¡Cultivo actualizado exitosamente!', 'success');

                    setTimeout(() => {
                        window.location.href = 'listar_cultivo.html';
                    }, 1000);

                } catch (error) {
                    console.error('Error al actualizar:', error);
                    showMessage(error.message, 'error');
                }
            });
        });
    </script>
</body>

</html>
